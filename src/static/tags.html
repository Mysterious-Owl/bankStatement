<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Tags</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/common.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <style>

        .autocomplete-dropdown.show {
            display: block;
        }



        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(142, 142, 147, 0.1);
        }

        th {
            background: rgba(28, 28, 30, 0.9);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            color: #8e8e93;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: rgba(28, 28, 30, 1);
        }

        tr:hover td {
            background: rgba(58, 58, 60, 0.3);
        }

        .search-input {
            font-size: 10px;
            padding: 4px 6px;
            background: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 4px;
            color: #d1d1d6;
            width: 100%;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }




        .filter-control-btn {
            padding: 2px 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color-strong);
            cursor: pointer;
            transition: background-color 0.2s var(--ease-apple);
        }

        .filter-control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(28, 28, 30, 0.95);
        }

        th.group:hover .group-hover\:opacity-100 {
            opacity: 1;
        }

        tr.selected {
            background-color: rgba(10, 132, 255, 0.1) !important;
            border-left: 2px solid var(--accent-primary);
        }

        /* Tags applied by a saved group rule, as opposed to hand-tagged rows */
        .tag-chip.is-rule {
            background: rgba(191, 90, 242, 0.16);
            border-color: rgba(191, 90, 242, 0.4);
            color: #d9a2f7;
        }

        /* --- Tag library ------------------------------------------------ */
        .vocab-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            padding: 0.5rem 0.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .vocab-row:last-child {
            border-bottom: none;
        }

        .vocab-name {
            flex: 0 1 auto;
            min-width: 7rem;
        }

        .vocab-usage {
            flex: 1 1 auto;
            font-size: 0.75rem;
            color: var(--text-muted, #8e8e93);
        }

        /* A tag nothing currently carries -- usually a stale rule, and the
           main thing this panel exists to let the user clean up. */
        .vocab-usage.is-unused {
            color: #ff9f0a;
        }

        .vocab-actions {
            display: flex;
            gap: 0.375rem;
            margin-left: auto;
        }

        /* Narrow screens: keep the tag and its two buttons on one line and
           drop the usage summary below, rather than clipping Delete. */
        @media (max-width: 640px) {
            .vocab-usage {
                order: 3;
                flex-basis: 100%;
            }

            .vocab-actions {
                order: 2;
            }
        }

        .vocab-rename-input {
            width: 11rem;
            padding: 0.25rem 0.5rem !important;
            font-size: 0.8125rem;
        }

        .vocab-btn {
            padding: 0.25rem 0.625rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary, #aeaeb2);
            cursor: pointer;
            transition: background-color 0.15s var(--ease-apple);
        }

        .vocab-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .vocab-btn.is-danger:hover {
            background: rgba(255, 69, 58, 0.18);
            border-color: rgba(255, 69, 58, 0.45);
            color: #ff6961;
        }
        /* Tall, full-width transaction list with its own scrolling body. */
        .modal-content {
            width: 95%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body class="min-h-screen">


    <div class="page-content p-4 md:p-8">
    <header class="page-hero mb-8">
        <h1>Transaction Tags</h1>
        <p>Group transactions and manage tag assignments</p>
    </header>

    <!-- Tag library: vocabulary-level operations, as opposed to the
         per-group assignment the table below handles. -->
    <div class="glass-panel p-5 mb-6">
        <div class="flex items-center justify-between gap-4">
            <div>
                <h2 class="text-base font-semibold text-slate-100">Tag Library</h2>
                <p class="text-xs text-slate-400 mt-0.5">
                    Rename or delete a tag everywhere it is used &mdash; manual, rule, and category
                </p>
            </div>
            <button class="filter-control-btn" id="vocabToggle" onclick="toggleVocabulary()">Show</button>
        </div>
        <div id="vocabBody" class="hidden mt-4"></div>
    </div>

    <!-- Data Table -->
    <div class="glass-panel overflow-hidden">
        <div class="overflow-x-auto" style="max-height: 75vh">
            <table id="tagsTable">
                <thead class="sticky-header">
                    <tr id="tableHeader">
                        <!-- Dynamic headers -->
                    </tr>
                    <tr id="searchRow" class="sticky-header" style="top: 32px;">
                        <!-- Dynamic search inputs -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="100" class="text-center py-20 text-slate-500">
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    </div>

    <!-- Column Selector Modal -->
    <div id="columnModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="glass-panel p-6 w-96">
            <h3 class="text-xl font-bold mb-4">Select Grouping Columns</h3>
            <div id="columnCheckboxes" class="space-y-2 mb-6 max-h-96 overflow-y-auto">
                <!-- Checkboxes will be inserted here -->
            </div>
            <div class="flex gap-2">
                <button onclick="applyColumnSelection()"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg">
                    Apply
                </button>
                <button onclick="closeColumnSelector()"
                    class="flex-1 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Transaction Detail Modal -->
    <div id="transactionModal" class="modal" onclick="if(event.target === this) closeTransactionModal()">
        <div class="modal-content glass-panel">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold">Transaction Details</h2>
                <button onclick="closeTransactionModal()" class="p-2 hover:bg-slate-700 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="transactionContent" class="flex-1 overflow-auto p-4">
                <!-- Transaction grid will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        let allGroups = [];
        let filteredGroups = [];
        let selectedRows = new Set();
        let selectedColumns = ['category', 'rule'];
        let sortState = { column: null, asc: true };
        let searchFilters = {};
        let tagAutocomplete = [];
        let availableColumns = [
            { key: 'category', label: 'Rule Category', type: 'standard' },
            { key: 'rule', label: 'Rule', type: 'standard' },
            { key: 'bank', label: 'Bank', type: 'standard' },
            { key: 'source_file', label: 'Source File', type: 'standard' }
        ];
        let hideNullFilters = {};

        async function init() {
            await loadEntityColumns();
            await loadAutocomplete();

            // Set default columns after entity columns are loaded
            const upiIdCol = availableColumns.find(c => c.key === 'upi_id' || c.key.toLowerCase().includes('upi'));
            if (upiIdCol) {
                selectedColumns = ['category', 'rule', upiIdCol.key];
            }

            await loadGroups();
            renderColumnSelector();
        }

        async function loadEntityColumns() {
            try {
                const res = await fetch('/api/rules');
                const rules = await res.json();

                // Extract all unique entity fields from rules
                const entityFields = new Set();
                rules.forEach(rule => {
                    if (rule.extraction_fields && Array.isArray(rule.extraction_fields)) {
                        rule.extraction_fields.forEach(field => entityFields.add(field));
                    }
                    // Also check pattern for named groups
                    if (rule.pattern) {
                        const namedGroups = rule.pattern.match(/\?P<(\w+)>/g);
                        if (namedGroups) {
                            namedGroups.forEach(group => {
                                const fieldName = group.match(/\?P<(\w+)>/)[1];
                                entityFields.add(fieldName);
                            });
                        }
                    }
                });

                // Add entity columns to available columns
                entityFields.forEach(field => {
                    if (!availableColumns.find(col => col.key === field)) {
                        availableColumns.push({
                            key: field,
                            label: field.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                            type: 'entity'
                        });
                    }
                });
            } catch (err) {
                console.error('Failed to load entity columns:', err);
            }
        }

        async function loadAutocomplete() {
            try {
                const res = await fetch('/api/tags/autocomplete');
                tagAutocomplete = await res.json();
            } catch (err) {
                console.error('Failed to load autocomplete:', err);
            }
        }

        async function loadGroups() {
            try {
                const columnsParam = selectedColumns.join(',');
                const res = await fetch(`/api/tags/grouped?columns=${columnsParam}`);
                allGroups = await res.json();
                selectedRows.clear(); // Reset selection on reload
                renderTableStructure();
                applyFilters();
            } catch (err) {
                console.error('Failed to load groups:', err);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="100" class="text-center py-20 text-red-400">Error loading data</td></tr>';
            }
        }

        function renderColumnChips() {
            const container = document.getElementById('selectedColumns');
            if (!container) return;
            container.innerHTML = selectedColumns.map(col => {
                const colDef = availableColumns.find(c => c.key === col);
                return `
                    <div class="flex items-center gap-2 px-2 py-1 bg-blue-600 rounded-lg text-xs">
                        <span>${colDef ? colDef.label : col}</span>
                        <button onclick="removeColumn('${col}')" class="hover:text-red-400">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function renderColumnSelector() {
            const container = document.getElementById('columnCheckboxes');
            if (!container) return;
            container.innerHTML = availableColumns.map(col => `
                <label class="flex items-center gap-2 cursor-pointer p-2 hover:bg-slate-700/50 rounded transition-colors">
                    <input type="checkbox" value="${col.key}" 
                        ${selectedColumns.includes(col.key) ? 'checked' : ''}
                        class="w-4 h-4 rounded">
                    <span class="text-sm">${col.label}</span>
                </label>
            `).join('');
        }

        function openColumnSelector() {
            document.getElementById('columnModal').classList.remove('hidden');
        }

        function closeColumnSelector() {
            document.getElementById('columnModal').classList.add('hidden');
        }

        function applyColumnSelection() {
            const checkboxes = document.querySelectorAll('#columnCheckboxes input:checked');
            selectedColumns = Array.from(checkboxes).map(cb => cb.value);

            if (selectedColumns.length === 0) {
                alert('Please select at least one column');
                return;
            }

            closeColumnSelector();
            searchFilters = {}; // Reset filters when columns change
            hideNullFilters = {};
            loadGroups();
        }

        function removeColumn(col) {
            selectedColumns = selectedColumns.filter(c => c !== col);
            if (selectedColumns.length === 0) {
                selectedColumns = ['category'];
            }
            delete searchFilters[col];
            delete hideNullFilters[col];
            loadGroups();
        }

        function renderTableStructure() {
            const headerRow = document.getElementById('tableHeader');

            // Checkbox column
            let headers = '<th class="w-10"></th>';

            // Grouping columns
            headers += selectedColumns.map(col => {
                const colDef = availableColumns.find(c => c.key === col);
                const label = colDef ? colDef.label : col;
                const sortIcon = getSortIcon(col);
                return `
                    <th class="group relative">
                        <div class="flex items-center justify-between">
                            <span onclick="sortBy('${col}')" class="flex-1">${label} ${sortIcon}</span>
                            <button onclick="event.stopPropagation(); removeColumn('${col}')" 
                                    class="p-1 text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                    </th>`;
            }).join('');

            // Plus column
            headers += `
                <th class="w-10 text-center">
                    <button onclick="openColumnSelector()" class="p-1.5 rounded bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white transition-all">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </th>
            `;

            headers += '<th onclick="sortBy(\'count\')">Count ' + getSortIcon('count') + '</th><th>Tags</th><th class="w-16"></th>';
            headerRow.innerHTML = headers;

            // Render search row
            const searchRow = document.getElementById('searchRow');

            // "Select All" in the checkbox column
            let searchCells = `<th class="text-center">
                <input type="checkbox" onchange="toggleSelectAll(event)" class="w-4 h-4 rounded mt-1" id="selectAllCheckbox">
            </th>`;

            searchCells += selectedColumns.map(col => {
                const currentValue = searchFilters[col] || '';
                const hideNull = hideNullFilters[col] || false;
                return `<th>
                    <div class="flex gap-1 items-center">
                        <input type="text" class="search-input flex-1" placeholder="Search..." value="${App.escapeHtml(currentValue)}" oninput="filterBy('${col}', this.value)">
                        <button class="filter-control-btn" onclick="clearFilter('${col}')" title="Clear filter">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                        <button class="filter-control-btn ${hideNull ? 'bg-blue-600' : ''}" onclick="toggleHideNull('${col}')" title="Hide null/empty">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </th>`;
            }).join('');

            // Placeholder for Plus column
            searchCells += '<th></th>';
            // Placeholder for Count column
            searchCells += '<th></th>';

            // Bulk Tag Input in Tags column
            searchCells += `<th>
                <div class="relative">
                    <input type="text" id="bulk-tag-input" 
                        class="search-input" 
                        placeholder="Bulk Tag..." 
                        onkeydown="handleBulkTagInput(event)"
                        oninput="showAutocomplete(event, 'bulk')">
                    <div class="autocomplete-dropdown" id="autocomplete-bulk"></div>
                </div>
            </th>`;

            // Action column placeholder
            searchCells += '<th></th>';

            searchRow.innerHTML = searchCells;
        }

        function toggleSelectAll(event) {
            const checked = event.target.checked;
            selectedRows.clear();
            if (checked) {
                filteredGroups.forEach(g => selectedRows.add(g.group_key));
            }
            renderTableBody();
        }

        function toggleRowSelection(groupKey) {
            if (selectedRows.has(groupKey)) {
                selectedRows.delete(groupKey);
            } else {
                selectedRows.add(groupKey);
            }
            renderTableBody();

            // Update Select All checkbox
            const selectAll = document.getElementById('selectAllCheckbox');
            if (selectAll) {
                selectAll.checked = filteredGroups.length > 0 && selectedRows.size === filteredGroups.length;
                selectAll.indeterminate = selectedRows.size > 0 && selectedRows.size < filteredGroups.length;
            }
        }

        async function handleBulkTagInput(event) {
            const input = event.target;
            if (event.key === 'Enter' || event.key === ',') {
                event.preventDefault();
                const tag = input.value.trim().replace(/,$/, '');
                if (!tag) return;

                if (selectedRows.size === 0) {
                    alert('Please select at least one row');
                    return;
                }

                const keysToApply = Array.from(selectedRows);
                input.disabled = true;
                input.placeholder = `Applying to ${keysToApply.length} rows...`;

                for (const key of keysToApply) {
                    await addTag(key, tag, false); // Pass false to skip render on each call
                }

                input.disabled = false;
                input.value = '';
                input.placeholder = 'Bulk Tag...';
                hideAutocomplete('bulk');

                // Final render
                renderTable();
            }
        }

        function clearFilter(column) {
            delete searchFilters[column];
            applyFilters();
            renderTableStructure();
        }

        function toggleHideNull(column) {
            hideNullFilters[column] = !hideNullFilters[column];
            applyFilters();
            renderTableStructure();
        }

        function renderTable() {
            renderTableBody();
        }

        function renderTableBody() {
            const headerRow = document.getElementById('tableHeader');
            const headers = headerRow.querySelectorAll('th');

            // Update header sort icons - index 0 is checkbox
            selectedColumns.forEach((col, idx) => {
                const headIdx = idx + 1;
                if (headers[headIdx]) {
                    const colDef = availableColumns.find(c => c.key === col);
                    const label = colDef ? colDef.label : col;
                    const sortIcon = getSortIcon(col);
                    const span = headers[headIdx].querySelector('span');
                    if (span) span.innerHTML = `${label} ${sortIcon}`;
                }
            });

            // Count header index: 1 (checkbox) + selectedColumns.length + 1 (plus)
            const countHeaderIndex = selectedColumns.length + 2;
            if (headers[countHeaderIndex]) {
                headers[countHeaderIndex].innerHTML = 'Count ' + getSortIcon('count');
            }

            const tbody = document.getElementById('tableBody');

            if (filteredGroups.length === 0) {
                tbody.innerHTML = '<tr><td colspan="100" class="text-center py-20 text-slate-500">No data</td></tr>';
                return;
            }

            tbody.innerHTML = filteredGroups.map(group => {
                // Row checkbox
                let cells = `<td class="text-center">
                    <input type="checkbox" ${selectedRows.has(group.group_key) ? 'checked' : ''} 
                           onchange="toggleRowSelection(${App.jsArg(group.group_key)})"
                           class="w-4 h-4 rounded">
                </td>`;

                cells += selectedColumns.map(col => {
                    let value = '';
                    if (group.entity_values && group.entity_values[col]) {
                        value = group.entity_values[col];
                    } else {
                        value = group[col] || '';
                    }

                    if (col === 'category' && group.category_color) {
                        return `<td><span class="px-2 py-1 rounded text-xs" style="background: ${group.category_color}20; color: ${group.category_color}; border: 1px solid ${group.category_color}40">${App.escapeHtml(value)}</span></td>`;
                    }
                    return `<td class="text-xs">${App.escapeHtml(value)}</td>`;
                }).join('');

                // Plus column placeholder
                cells += `<td class="w-10"></td>`;

                cells += `<td class="text-xs font-semibold">${group.count}</td>`;
                cells += `<td>${renderTagInput(group)}</td>`;
                cells += `<td class="text-center">
                    <button onclick="viewGroup(${App.jsArg(group.group_key)})" class="p-1 hover:bg-slate-700 rounded">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </td>`;
                return `<tr class="${selectedRows.has(group.group_key) ? 'selected' : ''}">${cells}</tr>`;
            }).join('');
        }

        const escapeHtml = App.escapeHtml;

        function renderTagInput(group) {
            // Tags shown with how many transactions in the group carry them,
            // and marked when they come from a saved rule rather than from
            // individual manual tagging -- removing those two is different.
            const ruleTags = new Set(group.rule_tags || []);
            let tagChips = '';
            if (group.tag_counts) {
                tagChips = Object.entries(group.tag_counts).map(([tag, count]) => {
                    const isRule = ruleTags.has(tag);
                    const coversAll = count === group.count;
                    return `
                    <div class="tag-chip ${isRule ? 'is-rule' : ''}"
                         title="${isRule ? 'Applied by a group rule to all matching transactions' : 'Tagged manually'} — on ${count} of ${group.count}">
                        <span>${escapeHtml(tag)}${coversAll ? '' : ` · ${count}/${group.count}`}</span>
                        <span class="remove" onclick="removeTag(${App.jsArg(group.group_key)}, ${App.jsArg(tag)})">×</span>
                    </div>
                `;
                }).join('');
            } else if (group.tags) {
                tagChips = group.tags.map(tag => `
                    <div class="tag-chip">
                        <span>${escapeHtml(tag)}</span>
                        <span class="remove" onclick="removeTag(${App.jsArg(group.group_key)}, ${App.jsArg(tag)})">×</span>
                    </div>
                `).join('');
            }

            const safeGroupKey = group.group_key.replace(/[^a-zA-Z0-9]/g, '_');

            return `
                <div class="flex flex-wrap items-center gap-2">
                    ${tagChips}
                    <div class="relative flex-1 min-w-[120px]">
                        <input 
                            type="text" 
                            class="w-full px-2 py-1 text-xs bg-slate-900 border border-slate-700 rounded focus:border-blue-500 focus:outline-none"
                            placeholder="Add tag..."
                            onkeydown="handleTagInput(event, ${App.jsArg(group.group_key)})"
                            oninput="showAutocomplete(event, ${App.jsArg(group.group_key)})"
                            id="tag-input-${safeGroupKey}"
                        >
                        <div class="autocomplete-dropdown" id="autocomplete-${safeGroupKey}"></div>
                    </div>
                </div>
            `;
        }

        function handleTagInput(event, groupKey) {
            const input = event.target;

            if (event.key === 'Enter' || event.key === ',') {
                event.preventDefault();
                const tag = input.value.trim().replace(/,$/, '');
                if (tag) {
                    addTag(groupKey, tag);
                    input.value = '';
                    hideAutocomplete(groupKey);
                }
            } else if (event.key === 'Escape') {
                hideAutocomplete(groupKey);
            }
        }

        function showAutocomplete(event, groupKey) {
            const input = event.target;
            const value = input.value.toLowerCase();

            if (!value) {
                hideAutocomplete(groupKey);
                return;
            }

            const matches = tagAutocomplete.filter(tag => tag.toLowerCase().includes(value));
            const dropdownId = groupKey.replace(/[^a-zA-Z0-9]/g, '_');
            const dropdown = document.getElementById(`autocomplete-${dropdownId}`);

            if (matches.length === 0) {
                hideAutocomplete(groupKey);
                return;
            }

            dropdown.innerHTML = matches.map(tag => `
                <div class="autocomplete-item" onclick="selectAutocomplete(${App.jsArg(groupKey)}, ${App.jsArg(tag)})">
                    ${escapeHtml(tag)}
                </div>
            `).join('');
            dropdown.classList.add('show');
        }

        function selectAutocomplete(groupKey, tag) {
            addTag(groupKey, tag);
            const inputId = groupKey.replace(/[^a-zA-Z0-9]/g, '_');
            const input = document.getElementById(`tag-input-${inputId}`);
            if (input) {
                input.value = '';
            }
            hideAutocomplete(groupKey);
        }

        function hideAutocomplete(groupKey) {
            const dropdownId = groupKey.replace(/[^a-zA-Z0-9]/g, '_');
            const dropdown = document.getElementById(`autocomplete-${dropdownId}`);
            if (dropdown) {
                dropdown.classList.remove('show');
            }
        }

        /**
         * Adding a tag here creates/extends the group's *rule*, so it applies
         * to every transaction matching the criteria (now and in future).
         *
         * Only rule tags are sent -- previously the whole aggregated tag list
         * went back, which quietly promoted tags someone had applied to a
         * single transaction into a rule covering the entire group.
         */
        /* Persist a group's rule tags as a criteria rule. `criteria` is the
           structured form of the group key -- the delimited string can't
           round-trip values containing a pipe. */
        function saveGroupRule(group) {
            return App.postJson('/api/tags/apply', {
                group_key: group.group_key,
                criteria: group.criteria,
                tags: group.rule_tags,
                create_rule: true,
                grouping_columns: selectedColumns
            });
        }

        async function addTag(groupKey, tag, shouldRender = true) {
            const group = allGroups.find(g => g.group_key === groupKey);
            if (!group) return;

            if (!group.tags) group.tags = [];
            if (!group.tag_counts) group.tag_counts = {};
            if (!group.rule_tags) group.rule_tags = [];

            if (!group.rule_tags.includes(tag)) {
                group.rule_tags.push(tag);
                if (!group.tags.includes(tag)) group.tags.push(tag);
                group.tag_counts[tag] = group.count;

                saveGroupRule(group);

                if (!tagAutocomplete.includes(tag)) {
                    tagAutocomplete.push(tag);
                }

                if (shouldRender) renderTable();
            }
        }

        /**
         * Removing a rule tag rewrites the rule; removing a tag that was only
         * ever applied by hand strips it from that group's transactions
         * instead. Treating both the same way meant manual tags could not be
         * removed from this page at all.
         */
        async function removeTag(groupKey, tag) {
            const group = allGroups.find(g => g.group_key === groupKey);
            if (!group) return;

            const isRuleTag = (group.rule_tags || []).includes(tag);

            group.tags = (group.tags || []).filter(t => t !== tag);
            group.rule_tags = (group.rule_tags || []).filter(t => t !== tag);
            if (group.tag_counts && group.tag_counts[tag]) {
                delete group.tag_counts[tag];
            }

            if (isRuleTag) {
                saveGroupRule(group);
            } else {
                App.postJson('/api/tags/bulk', { anno_keys: group.anno_keys || [], remove_tags: [tag] });
            }

            renderTable();
        }

        /* --- Tag library -------------------------------------------------
         *
         * Renaming and deleting are vocabulary-level operations: they reach
         * every place a tag appears, which is why they live here rather than
         * on an individual group row. Anything mutated here invalidates the
         * grouped view, so the table is reloaded afterwards.
         */
        let vocabulary = [];
        let renamingTag = null;

        function toggleVocabulary() {
            const body = document.getElementById('vocabBody');
            const toggle = document.getElementById('vocabToggle');
            const showing = body.classList.toggle('hidden');
            toggle.textContent = showing ? 'Show' : 'Hide';
            if (!showing) loadVocabulary();
        }

        async function loadVocabulary() {
            const body = document.getElementById('vocabBody');
            try {
                vocabulary = await App.api('/api/tags/vocabulary');
            } catch (err) {
                body.innerHTML = `<p class="text-sm text-red-400">Failed to load tags: ${escapeHtml(err.message)}</p>`;
                return;
            }
            renderVocabulary();
        }

        function usageSummary(tag) {
            const parts = [];
            if (tag.transactions) parts.push(`${tag.transactions} transaction${tag.transactions === 1 ? '' : 's'}`);
            if (tag.rules) parts.push(`${tag.rules} rule${tag.rules === 1 ? '' : 's'}`);
            if (tag.categories) parts.push(`${tag.categories} categor${tag.categories === 1 ? 'y' : 'ies'}`);
            if (tag.orphans) parts.push(`${tag.orphans} orphaned`);
            return parts.length ? parts.join(' · ') : 'not used by anything';
        }

        function renderVocabulary() {
            const body = document.getElementById('vocabBody');

            if (!vocabulary.length) {
                body.innerHTML = '<p class="text-sm text-slate-500">No tags yet. Add one from the table below.</p>';
                return;
            }

            // Handlers address rows by index rather than by name: a tag
            // containing a quote would otherwise break out of the inline
            // attribute, and tags are free text.
            body.innerHTML = vocabulary.map((tag, i) => {
                const name = escapeHtml(tag.name);
                const nameCell = renamingTag === tag.name
                    ? `<input type="text" class="vocab-rename-input" value="${name}"
                              id="vocab-rename-input"
                              onkeydown="handleRenameKey(event, ${i})"
                              onblur="commitRename(${i})">`
                    : `<span class="tag-chip">${name}</span>`;

                return `
                    <div class="vocab-row">
                        <div class="vocab-name">${nameCell}</div>
                        <div class="vocab-usage${tag.transactions ? '' : ' is-unused'}">${usageSummary(tag)}</div>
                        <div class="vocab-actions">
                            <button class="vocab-btn" onclick="startRename(${i})">Rename</button>
                            <button class="vocab-btn is-danger" onclick="deleteTag(${i})">Delete</button>
                        </div>
                    </div>`;
            }).join('');

            const input = document.getElementById('vocab-rename-input');
            if (input) {
                input.focus();
                input.select();
            }
        }

        function startRename(index) {
            renamingTag = vocabulary[index].name;
            renderVocabulary();
        }

        function handleRenameKey(event, index) {
            if (event.key === 'Enter') {
                event.target.blur();  // blur commits
            } else if (event.key === 'Escape') {
                renamingTag = null;
                // Reset the value first: blur fires next and would otherwise
                // read the abandoned edit as a commit.
                event.target.value = vocabulary[index].name;
                renderVocabulary();
            }
        }

        async function commitRename(index) {
            const oldName = vocabulary[index].name;
            if (renamingTag !== oldName) return;  // already cancelled
            const input = document.getElementById('vocab-rename-input');
            const newName = input ? input.value.trim() : '';
            renamingTag = null;

            if (!newName || newName === oldName) {
                renderVocabulary();
                return;
            }

            const existing = vocabulary.some(t => t.name === newName);
            if (existing && !confirm(`"${newName}" already exists. Rename will merge "${oldName}" into it. Continue?`)) {
                renderVocabulary();
                return;
            }

            try {
                await App.postJson('/api/tags/rename', { old_name: oldName, new_name: newName });
            } catch (err) {
                alert('Rename failed: ' + err.message);
            }
            await refreshAfterVocabChange();
        }

        async function deleteTag(index) {
            const tag = vocabulary[index];
            const name = tag.name;
            if (!confirm(`Delete "${name}" everywhere?\n\nCurrently used by: ${usageSummary(tag)}.\nThis cannot be undone.`)) return;

            try {
                await App.postJson('/api/tags/delete', { name });
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
            await refreshAfterVocabChange();
        }

        /* The grouped table and the autocomplete list both embed tag names, so
           neither survives a rename or delete untouched. */
        async function refreshAfterVocabChange() {
            await Promise.all([loadVocabulary(), loadAutocomplete()]);
            await loadGroups();
        }

        function sortBy(column) {
            if (sortState.column === column) {
                sortState.asc = !sortState.asc;
            } else {
                sortState.column = column;
                sortState.asc = true;
            }
            applyFilters();
        }

        function getSortIcon(column) {
            if (sortState.column !== column) return '';
            return sortState.asc ? '↑' : '↓';
        }

        function filterBy(column, value) {
            if (value) {
                searchFilters[column] = value.toLowerCase();
            } else {
                delete searchFilters[column];
            }
            applyFilters();
        }

        function applyFilters() {
            // Apply search filters
            filteredGroups = allGroups.filter(group => {
                for (let col in searchFilters) {
                    let groupValue = '';

                    // Check entity values first
                    if (group.entity_values && group.entity_values[col]) {
                        groupValue = group.entity_values[col];
                    } else {
                        groupValue = group[col] || '';
                    }

                    groupValue = groupValue.toString().toLowerCase();
                    if (!groupValue.includes(searchFilters[col])) {
                        return false;
                    }
                }

                // Apply hide null filters
                for (let col in hideNullFilters) {
                    if (hideNullFilters[col]) {
                        let groupValue = '';
                        if (group.entity_values && group.entity_values[col]) {
                            groupValue = group.entity_values[col];
                        } else {
                            groupValue = group[col] || '';
                        }
                        if (!groupValue || groupValue === 'null' || groupValue === 'None') {
                            return false;
                        }
                    }
                }

                return true;
            });

            // Apply sorting
            if (sortState.column) {
                filteredGroups.sort((a, b) => {
                    let valA, valB;

                    if (sortState.column === 'count') {
                        valA = a.count || 0;
                        valB = b.count || 0;
                    } else {
                        // Check entity values first
                        if (a.entity_values && a.entity_values[sortState.column]) {
                            valA = a.entity_values[sortState.column];
                        } else {
                            valA = a[sortState.column] || '';
                        }

                        if (b.entity_values && b.entity_values[sortState.column]) {
                            valB = b.entity_values[sortState.column];
                        } else {
                            valB = b[sortState.column] || '';
                        }
                    }

                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();

                    if (valA < valB) return sortState.asc ? -1 : 1;
                    if (valA > valB) return sortState.asc ? 1 : -1;
                    return 0;
                });
            }

            renderTable();
        }

        function formatDate(dateValue) {
            if (!dateValue) return '-';

            // If it's a Unix timestamp (number)
            if (typeof dateValue === 'number') {
                return new Date(dateValue).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }

            // If it's already a string
            return dateValue;
        }

        async function viewGroup(groupKey) {
            try {
                const res = await fetch(`/api/tags/details/${encodeURIComponent(groupKey)}`);
                const transactions = await res.json();

                // Create a data grid similar to data.html
                const dataColumns = ['Date', 'Description', 'Debit', 'Credit', 'Balance', 'Bank'];

                const tableHtml = `
                    <div class="overflow-auto" style="max-height: 80vh">
                        <table class="w-full">
                            <thead class="sticky-header">
                                <tr>
                                    ${dataColumns.map(col => `<th class="text-left">${col}</th>`).join('')}
                                    <th class="text-left">Tags</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${transactions.map(txn => {
                    const txnId = txn.txn_id || txn.TxnID || '0';
                    const currentTags = txn.tags || [];
                    return `
                                        <tr class="border-b border-slate-700 hover:bg-slate-800">
                                            <td class="text-xs py-2">${formatDate(txn.Date)}</td>
                                            <td class="text-xs py-2">${escapeHtml(txn.Description || '-')}</td>
                                            <td class="text-xs py-2 text-red-400">${txn.Debit || '-'}</td>
                                            <td class="text-xs py-2 text-green-400">${txn.Credit || '-'}</td>
                                            <td class="text-xs py-2">${txn.Balance || '-'}</td>
                                            <td class="text-xs py-2">${App.escapeHtml(txn.Bank || '-')}</td>
                                            <td class="text-xs py-2">
                                                <div class="flex flex-wrap gap-1 items-center">
                                                    ${currentTags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}
                                                    <div class="relative min-w-[100px]">
                                                        <input 
                                                            type="text" 
                                                            class="w-full px-2 py-1 text-xs bg-slate-900 border border-slate-700 rounded focus:border-blue-500 focus:outline-none"
                                                            placeholder="Add tag..."
                                                            onkeydown="handleTransactionTagInput(event, '${escapeHtml(txnId)}')"
                                                            id="txn-tag-input-${escapeHtml(txnId).replace(/[^a-zA-Z0-9]/g, '_')}"
                                                        >
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    `;
                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                document.getElementById('transactionContent').innerHTML = tableHtml;
                document.getElementById('transactionModal').classList.add('show');
            } catch (err) {
                console.error('Failed to load group details:', err);
                alert('Failed to load transaction details');
            }
        }

        async function handleTransactionTagInput(event, txnId) {
            if (event.key === 'Enter' || event.key === ',') {
                event.preventDefault();
                // Clean txnId for use as element ID
                const cleanTxnId = txnId.replace(/[^a-zA-Z0-9]/g, '_');
                const input = document.getElementById(`txn-tag-input-${cleanTxnId}`);
                if (!input) return;

                const newTag = input.value.trim();
                if (!newTag) return;

                try {
                    const res = await fetch('/api/tags/transaction', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            txn_id: txnId.toString(),
                            tags: [newTag],
                            source: 'manual'
                        })
                    });

                    if (res.ok) {
                        input.value = '';
                        // Add tag chip inline
                        const tagContainer = input.parentElement.parentElement;
                        const chip = document.createElement('span');
                        chip.className = 'tag-chip';
                        chip.textContent = newTag;
                        tagContainer.insertBefore(chip, input.parentElement);
                    }
                } catch (err) {
                    console.error('Failed to save tag:', err);
                    alert('Failed to save tag');
                }
            }
        }

        function closeTransactionModal() {
            document.getElementById('transactionModal').classList.remove('show');
        }

        // Initialize
        init();
    </script>
</body>

</html>
