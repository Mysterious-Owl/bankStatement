<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Tags</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/common.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <style>
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(142, 142, 147, 0.1);
        }

        th {
            background: rgba(28, 28, 30, 0.5);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            color: #8e8e93;
        }

        tr:hover td {
            background: rgba(58, 58, 60, 0.3);
        }
    </style>
</head>

<body class="min-h-screen">


    <div class="page-content p-4 md:p-8">
    <header class="page-hero mb-8">
        <h1>Category Tags</h1>
        <p>Manage default tags applied per category</p>
    </header>

    <div class="glass-panel p-6 mb-4">
        <p class="text-sm text-slate-400">
            Set default tags for each category. These tags will automatically apply to transactions that match the
            category but don't have more specific rule-based tags.
        </p>
    </div>

    <!-- Category Tags Table -->
    <div class="glass-panel overflow-hidden">
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Default Tags</th>
                    </tr>
                </thead>
                <tbody id="categoryTable">
                    <tr>
                        <td colspan="2" class="text-center py-20 text-slate-500">
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    </div>

    <script>
        let categories = [];
        let categoryTags = {};

        async function init() {
            await loadCategories();
            await loadCategoryTags();
            renderTable();
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                categories = await res.json();
            } catch (err) {
                console.error('Failed to load categories:', err);
            }
        }

        async function loadCategoryTags() {
            try {
                const res = await fetch('/api/tags/category');
                categoryTags = await res.json();
            } catch (err) {
                console.error('Failed to load category tags:', err);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('categoryTable');

            if (categories.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center py-20 text-slate-500">No categories found</td></tr>';
                return;
            }

            tbody.innerHTML = categories.map(cat => {
                const tags = categoryTags[cat.id] || [];
                return `
                    <tr>
                        <td>
                            <span class="px-2 py-1 rounded text-sm" style="background: ${cat.color}20; color: ${cat.color}; border: 1px solid ${cat.color}40">
                                ${App.escapeHtml(cat.name)}
                            </span>
                        </td>
                        <td>
                            <div class="flex flex-wrap items-center gap-2">
                                ${tags.map(tag => `
                                    <div class="tag-chip">
                                        <span>${App.escapeHtml(tag)}</span>
                                        <span class="remove" onclick="removeTag(${App.jsArg(cat.id)}, ${App.jsArg(tag)})">×</span>
                                    </div>
                                `).join('')}
                                <input 
                                    type="text" 
                                    class="px-2 py-1 text-xs bg-slate-900 border border-slate-700 rounded focus:border-blue-500 focus:outline-none"
                                    placeholder="Add tag..."
                                    onkeydown="handleTagInput(event, '${cat.id}')"
                                    style="min-width: 120px"
                                >
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function handleTagInput(event, categoryId) {
            if (event.key === 'Enter' || event.key === ',') {
                event.preventDefault();
                const tag = event.target.value.trim();
                if (tag) {
                    addTag(categoryId, tag);
                    event.target.value = '';
                }
            }
        }

        async function addTag(categoryId, tag) {
            if (!categoryTags[categoryId]) {
                categoryTags[categoryId] = [];
            }

            if (!categoryTags[categoryId].includes(tag)) {
                categoryTags[categoryId].push(tag);
                await saveCategoryTags(categoryId);
                renderTable();
            }
        }

        async function removeTag(categoryId, tag) {
            categoryTags[categoryId] = categoryTags[categoryId].filter(t => t !== tag);
            await saveCategoryTags(categoryId);
            renderTable();
        }

        async function saveCategoryTags(categoryId) {
            try {
                await App.postJson('/api/tags/category', { category_id: categoryId, tags: categoryTags[categoryId] });
            } catch (err) {
                console.error('Failed to save category tags:', err);
            }
        }

        // Initialize
        init();
    </script>
</body>

</html>
