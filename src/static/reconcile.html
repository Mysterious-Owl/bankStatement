<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Reconciliation Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: #1e293b;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            padding: 1rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 0.875rem;
            transition: background 0.2s ease;
        }

        tr:hover td {
            background: rgba(30, 41, 59, 0.5);
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="p-6">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
            <div>
                <h1 class="text-4xl font-bold tracking-tight gradient-text">Reconciliation summary</h1>
                <p class="text-slate-400 mt-1 font-light">Audit institution health and statement freshness</p>
            </div>
            <nav class="flex items-center gap-3">
                <a href="/"
                    class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium flex items-center gap-2">
                    <span>Dashboard</span>
                </a>
                <a href="/data"
                    class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium flex items-center gap-2">
                    <span>Data Grid</span>
                </a>
                <a href="/rules"
                    class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium flex items-center gap-2">
                    <span>Rules</span>
                </a>
                <a href="/upload"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold transition-all shadow-lg shadow-blue-500/20 active:scale-95">
                    Upload Statements
                </a>
            </nav>
        </header>

        <div class="glass-panel overflow-hidden">
            <table class="min-w-full text-sm">
                <thead>
                    <tr>
                        <th class="font-semibold text-gray-300">Bank</th>
                        <th class="font-semibold text-gray-300 text-right">Statements</th>
                        <th class="font-semibold text-gray-300 text-right">Transactions</th>
                        <th class="font-semibold text-gray-300">Date Range</th>
                        <th class="font-semibold text-gray-300 text-right">Days Since Update</th>
                        <th class="font-semibold text-gray-300 text-right">Total Credit</th>
                        <th class="font-semibold text-gray-300 text-right">Total Debit</th>
                    </tr>
                </thead>
                <tbody id="reconBody">
                    <!-- Rows populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const currencyFormatter = new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0
        });

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/data.csv')
                .then(r => r.text())
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        dynamicTyping: true,
                        skipEmptyLines: true,
                        complete: function (results) {
                            processRecon(results.data);
                        }
                    });
                });
        });

        function processRecon(data) {
            const banks = {};
            const now = new Date();

            data.forEach(row => {
                const bank = row.Bank || 'Unknown';
                if (!banks[bank]) {
                    banks[bank] = {
                        count: 0,
                        files: new Set(),
                        dates: [],
                        credit: 0,
                        debit: 0
                    };
                }

                banks[bank].count++;
                if (row.SourceFile) banks[bank].files.add(row.SourceFile);
                if (row.Date) banks[bank].dates.push(row.Date);

                banks[bank].credit += parseFloat(String(row.Credit || 0).replace(/,/g, ''));
                banks[bank].debit += parseFloat(String(row.Debit || 0).replace(/,/g, ''));
            });

            const tbody = document.getElementById('reconBody');

            // Convert to array for sorting
            const bankStats = Object.keys(banks).map(bankName => {
                const info = banks[bankName];
                info.dates.sort();
                const minDate = info.dates.length ? info.dates[0] : '-';
                const maxDate = info.dates.length ? info.dates[info.dates.length - 1] : '-';

                let daysAgo = -1;
                if (maxDate !== '-') {
                    const lastDate = new Date(maxDate);
                    const diffTime = Math.abs(now - lastDate);
                    daysAgo = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                }

                return {
                    name: bankName,
                    ...info,
                    minDate,
                    maxDate,
                    daysAgo
                };
            });

            // Sort: most old (largest daysAgo) to most recent
            bankStats.sort((a, b) => b.daysAgo - a.daysAgo);

            bankStats.forEach(info => {
                const tr = document.createElement('tr');
                const daysStr = info.daysAgo === -1 ? '-' : `${info.daysAgo} days ago`;
                const daysColor = info.daysAgo > 30 ? 'text-red-400' : (info.daysAgo > 7 ? 'text-yellow-400' : 'text-gray-300');

                tr.innerHTML = `
                    <td class="font-medium text-white">${info.name}</td>
                    <td class="text-right text-gray-300">${info.files.size}</td>
                    <td class="text-right text-gray-300">${info.count.toLocaleString()}</td>
                    <td class="text-gray-400 font-mono text-xs">${info.minDate} to ${info.maxDate}</td>
                    <td class="text-right ${daysColor}">${daysStr}</td>
                    <td class="text-right text-green-400">${currencyFormatter.format(info.credit)}</td>
                    <td class="text-right text-red-400">${currencyFormatter.format(info.debit)}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>

</html>
