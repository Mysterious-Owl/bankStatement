<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Data Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .table-container {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            position: sticky;
            top: 0;
            background: #1e293b;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            padding: 1rem 0.75rem;
            text-align: left;
            z-index: 20;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 0.875rem;
            transition: background 0.2s ease;
        }

        tr:hover td {
            background: rgba(30, 41, 59, 0.5);
        }

        input,
        select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Side Drawer */
        #sideDrawer {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sideDrawer.closed {
            transform: translateX(100%);
        }

        /* Expand Animation */
        .expandable-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .expanded .expandable-content {
            max-height: 200px;
        }

        /* Row Details Expansion */
        .row-details {
            display: none;
            background: rgba(15, 23, 42, 0.4);
        }

        .row-details.expanded {
            display: table-row;
        }

        .expand-btn {
            transition: transform 0.2s ease;
        }

        .row-parent.expanded .expand-btn {
            transform: rotate(90deg);
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Autocomplete Dropdown */
        .autocomplete-container {
            position: relative;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .autocomplete-item {
            padding: 8px 12px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .autocomplete-item:hover {
            background: #1e293b;
            color: #fff;
        }

        .autocomplete-item.selected {
            background: #3b82f6;
            color: #fff;
        }
    </style>
</head>

<body class="p-4 md:p-8 min-h-screen">

    <!-- Header Area -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div>
            <h1 class="text-4xl font-bold tracking-tight gradient-text">Transaction Explorer</h1>
            <p class="text-slate-400 mt-1 font-light">Deep analysis of consolidated bank statements</p>
        </div>
        <nav class="flex items-center gap-3">
            <a href="/"
                class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium flex items-center gap-2">
                <span>Dashboard</span>
            </a>
            <a href="/rules"
                class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium flex items-center gap-2">
                <span>Rules</span>
            </a>
            <a href="/reconcile"
                class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium flex items-center gap-2">
                <span>Reconcile</span>
            </a>
            <a href="/upload"
                class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold transition-all shadow-lg shadow-blue-500/20 active:scale-95">
                Upload Statements
            </a>
            <button onclick="toggleDrawer()"
                class="glass-panel px-4 py-2 hover:bg-slate-800 transition-all font-medium text-slate-400 border-dashed">
                Columns
            </button>
        </nav>
    </header>

    <!-- Filter & Stats Deck -->
    <div class="glass-panel p-6 mb-8">
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Filter Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 flex-1">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Bank</label>
                    <select id="bankFilter" onchange="applyFilters()"
                        class="w-full h-9 px-3 rounded-lg text-xs bg-slate-900 border-slate-700">
                        <option value="">All Institutions</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Category</label>
                    <select id="categoryFilter" onchange="applyFilters()"
                        class="w-full h-9 px-3 rounded-lg text-xs bg-slate-900 border-slate-700">
                        <option value="">Any Category</option>
                        <option value="__unmatched__">Unmatched Only</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Timeline</label>
                    <div class="flex gap-1">
                        <input type="date" id="startDate" onchange="applyFilters()"
                            class="w-full h-9 px-2 rounded-lg text-[10px] bg-slate-900 border-slate-700">
                        <input type="date" id="endDate" onchange="applyFilters()"
                            class="w-full h-9 px-2 rounded-lg text-[10px] bg-slate-900 border-slate-700">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Tags (comma
                        separated)</label>
                    <div class="autocomplete-container">
                        <input type="text" id="tagFilter" oninput="handleTagFilterInput(event)"
                            placeholder="Filter tags..."
                            class="w-full h-9 px-3 rounded-lg text-xs bg-slate-900 border-slate-700">
                        <div id="tagAutocompleteDropdown" class="autocomplete-dropdown custom-scrollbar"></div>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Search</label>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search..." oninput="applyFilters()"
                            class="w-full h-9 pl-8 pr-4 rounded-lg text-xs bg-slate-900 border-slate-700">
                        <div class="absolute left-2.5 top-2.5 text-slate-500">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats & Export -->
            <div class="flex items-center gap-6 lg:border-l lg:border-slate-800 lg:pl-6">
                <div class="flex gap-4">
                    <div class="flex flex-col">
                        <span class="text-[9px] uppercase text-slate-500 font-bold tracking-tighter">Total</span>
                        <span id="totalCount" class="text-sm font-bold">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span
                            class="text-[9px] uppercase text-slate-500 font-bold tracking-tighter text-blue-400">Filtered</span>
                        <span id="filteredCount" class="text-sm font-bold text-blue-400">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span
                            class="text-[9px] uppercase text-slate-500 font-bold tracking-tighter text-indigo-400">Rules</span>
                        <span id="matchedCount" class="text-sm font-bold text-indigo-400">0</span>
                    </div>
                </div>

                <button onclick="downloadCSV()"
                    class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg transition-colors"
                    title="Export CSV">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div class="flex justify-between items-center mb-4 px-2">
        <div class="flex items-center gap-2 text-sm text-slate-400">
            <span>Show</span>
            <select id="pageSize" onchange="changePageSize()"
                class="bg-slate-900 border-slate-700 rounded px-2 py-1 text-xs">
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="500">500</option>
            </select>
            <span>rows per page</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1">
                <button onclick="changePage(-1000)"
                    class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                    </svg>
                </button>
                <button onclick="changePage(-1)"
                    class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>
            <span class="text-sm font-medium text-slate-300">Page <span id="currentPage">1</span> of <span
                    id="totalPages">1</span></span>
            <div class="flex items-center gap-1">
                <button onclick="changePage(1)"
                    class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
                <button onclick="changePage(1000)"
                    class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Data Table Container -->
    <div class="table-container glass-panel shadow-2xl">
        <div class="overflow-x-auto custom-scrollbar" style="max-height: 75vh;">
            <table id="dataTable">
                <thead id="tableHeader">
                    <!-- Dynamic Headers Inserted Here -->
                </thead>
                <tbody id="tableBody">
                    <!-- Loading State -->
                    <tr>
                        <td colspan="100" class="py-20 text-center">
                            <div class="inline-block animate-pulse text-slate-500 flex flex-col items-center">
                                <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7C5 4 4 5 4 7z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M8 12h8m-8 4h5" />
                                </svg>
                                <p class="text-lg font-light">Loading Transaction Ledger...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Column Selection Drawer -->
    <div id="drawerOverlay" onclick="toggleDrawer()"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity"></div>
    <div id="sideDrawer"
        class="fixed top-0 right-0 w-80 h-full bg-slate-900 border-l border-slate-700 z-50 shadow-2xl closed flex flex-col">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-xl font-bold">Preferences</h2>
            <button onclick="toggleDrawer()" class="text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scrollbar">
            <div>
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Standard Columns</h3>
                <div id="standardColList" class="space-y-3">
                    <!-- Standard Columns Checkboxes -->
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Rule Extraction Fields</h3>
                <p class="text-xs text-slate-500 mb-4">Dynamically detected from your rules</p>
                <div id="dynamicColList" class="space-y-3">
                    <!-- Dynamic Rule Fields Checkboxes -->
                </div>
            </div>
        </div>

        <div class="p-6 border-t border-slate-800 bg-slate-950/50">
            <button onclick="toggleDrawer()"
                class="w-full bg-white text-slate-950 py-3 rounded-lg font-bold hover:bg-slate-200 transition-colors shadow-lg shadow-white/5 active:scale-95">
                Apply & Save
            </button>
        </div>
    </div>

    <script>
        // Configuration
        const COLUMN_DEFAULTS = {
            'date': { label: 'Date', visible: true, type: 'standard' },
            'bank': { label: 'Bank', visible: true, type: 'standard' },
            'description': { label: 'Description', visible: true, type: 'standard' },
            'debit': { label: 'Debit', visible: true, type: 'standard', align: 'right' },
            'credit': { label: 'Credit', visible: true, type: 'standard', align: 'right' },
            'balance': { label: 'Balance', visible: false, type: 'standard', align: 'right' },
            'matched_category': { label: 'Category', visible: true, type: 'standard' },
            'matched_rule': { label: 'Rule', visible: true, type: 'standard' },
            'tags': { label: 'Tags', visible: true, type: 'standard' },
            'ref_number': { label: 'Reference', visible: false, type: 'standard' },
            'source_file': { label: 'Source', visible: false, type: 'standard' },
            'manual_remarks': { label: 'Remarks', visible: false, type: 'standard' },
            'system_remarks': { label: 'System Notes', visible: false, type: 'standard' },
            'original_category': { label: 'Legacy Cat', visible: false, type: 'standard' },
            'entity': { label: 'Legacy Entity', visible: false, type: 'standard' }
        };

        let sortState = {
            key: 'date',
            asc: false
        };

        let allData = [];
        let filteredData = [];
        let tagAutocomplete = [];

        let paginationState = {
            page: 1,
            pageSize: 50,
            totalPages: 1
        };

        const currencyFormatter = new Intl.NumberFormat('en-IN', { style: 'decimal', minimumFractionDigits: 2 });

        async function init() {
            // Load Settings
            loadSettings();

            // Fetch Data
            await loadData();

            // Load Autocomplete
            await loadTagAutocomplete();

            // Detect Dynamic Columns
            detectDynamicColumns();

            // Initial Render
            applyFilters();
            renderColumnControls();
        }

        function loadSettings() {
            const saved = localStorage.getItem('dataGridSettings');
            let base = JSON.parse(JSON.stringify(COLUMN_DEFAULTS));
            if (saved) {
                try {
                    const loaded = JSON.parse(saved);
                    // Merge loaded into base to ensure new columns (like tags) appear
                    Object.keys(loaded).forEach(k => {
                        if (base[k]) {
                            base[k].visible = loaded[k].visible;
                        } else if (k.startsWith('rule_')) {
                            // Preserve dynamic rule columns
                            base[k] = loaded[k];
                        }
                    });
                } catch (e) {
                    console.error("Error loading settings:", e);
                }
            }
            columnState = base;
        }

        function saveSettings() {
            localStorage.setItem('dataGridSettings', JSON.stringify(columnState));
        }

        async function loadData() {
            try {
                const res = await fetch('/api/transactions/enriched');
                const raw = await res.json();

                // Normalize keys to lowercase for internal logic compatibility
                allData = raw.map(t => {
                    const normalized = {};
                    Object.keys(t).forEach(k => {
                        normalized[k.toLowerCase()] = t[k];
                    });

                    // Standardize date to YYYY-MM-DD for simpler filtering
                    if (normalized.date && typeof normalized.date === 'string') {
                        normalized.date = normalized.date.split('T')[0];
                    }

                    // Tags come from API now
                    if (!normalized.tags) {
                        normalized.tags = [];
                    }

                    return normalized;
                });

                populateFilters();
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="100" class="text-center py-20 text-red-400">Error loading ledger. Check console.</td></tr>`;
            }
        }

        async function loadTagAutocomplete() {
            try {
                const res = await fetch('/api/tags/autocomplete');
                tagAutocomplete = await res.json();
            } catch (err) {
                console.error('Failed to load autocomplete:', err);
            }
        }

        function handleTagFilterInput(event) {
            const input = event.target;
            const value = input.value;
            const dropdown = document.getElementById('tagAutocompleteDropdown');

            // Re-apply filters on input
            applyFilters();

            // Logic for autocomplete on the current typing tag
            const parts = value.split(',');
            const currentPart = parts[parts.length - 1].trim().toLowerCase();

            if (!currentPart) {
                dropdown.style.display = 'none';
                return;
            }

            const matches = tagAutocomplete.filter(t => t.toLowerCase().includes(currentPart));
            if (matches.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            dropdown.innerHTML = matches.map(m => `
                <div class="autocomplete-item" onclick="selectTagFilter('${m}')">${m}</div>
            `).join('');
            dropdown.style.display = 'block';
        }

        function selectTagFilter(tag) {
            const input = document.getElementById('tagFilter');
            const value = input.value;
            const parts = value.split(',');
            parts[parts.length - 1] = tag;
            input.value = parts.join(',') + ', ';
            document.getElementById('tagAutocompleteDropdown').style.display = 'none';
            input.focus();
            applyFilters();
        }

        // Close dropdown on click outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.autocomplete-container')) {
                document.getElementById('tagAutocompleteDropdown').style.display = 'none';
            }
        });

        function detectDynamicColumns() {
            const detectedGroups = new Set();
            allData.forEach(t => {
                if (t.extracted_fields) {
                    Object.keys(t.extracted_fields).forEach(key => detectedGroups.add(key));
                }
            });

            detectedGroups.forEach(key => {
                const colKey = `rule_${key}`;
                if (!columnState[colKey]) {
                    columnState[colKey] = {
                        label: key.charAt(0).toUpperCase() + key.slice(1).replace('_', ' '),
                        visible: true,
                        type: 'rule',
                        field: key
                    };
                }
            });
        }

        function populateFilters() {
            bankSelect.innerHTML = '<option value="">All Institutions</option>' +
                banks.map(b => `<option value="${b}">${b}</option>`).join('');

            const catSelect = document.getElementById('categoryFilter');
            const categories = [...new Set(allData.map(t => t.matched_category))].filter(Boolean).sort();
            catSelect.innerHTML = '<option value="">Any Category</option><option value="__unmatched__">Unmatched Only</option>' +
                categories.map(c => `<option value="${c}">${c}</option>`).join('');

            const dateValues = allData.map(t => t.date).filter(d => d && d !== 'null').sort();
            if (dateValues.length) {
                // Default to last 12 months
                const lastDate = new Date(dateValues[dateValues.length - 1]);
                const oneYearAgo = new Date(lastDate);
                oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);

                const startVal = oneYearAgo.toISOString().split('T')[0];
                const endVal = lastDate.toISOString().split('T')[0];

                document.getElementById('startDate').value = startVal;
                document.getElementById('endDate').value = endVal;
            }
        }

        function toggleDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if (drawer.classList.contains('closed')) {
                drawer.classList.remove('closed');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 0);
            } else {
                drawer.classList.add('closed');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                saveSettings(); // Save when closing
                generateTableHeaders(); // Refresh headers
                renderTable(); // Refresh body
                updateStats();
            }
        }

        function renderColumnControls() {
            const standardList = document.getElementById('standardColList');
            const dynamicList = document.getElementById('dynamicColList');

            standardList.innerHTML = '';
            dynamicList.innerHTML = '';

            Object.entries(columnState).forEach(([key, config]) => {
                const item = document.createElement('label');
                item.className = 'flex items-center gap-3 cursor-pointer group';
                item.innerHTML = `
                    <div class="relative flex items-center">
                        <input type="checkbox" ${config.visible ? 'checked' : ''} 
                                onchange="toggleColumnVisibility('${key}')"
                                class="w-5 h-5 rounded border-slate-600 bg-slate-800 text-blue-600">
                    </div>
                    <span class="text-sm font-medium ${config.visible ? 'text-slate-200' : 'text-slate-500'} group-hover:text-blue-400 transition-colors">${config.label}</span>
                `;

                if (config.type === 'standard') standardList.appendChild(item);
                else dynamicList.appendChild(item);
            });
        }

        function toggleColumnVisibility(key) {
            columnState[key].visible = !columnState[key].visible;
            renderColumnControls();
        }

        function setSort(key) {
            if (sortState.key === key) {
                sortState.asc = !sortState.asc;
            } else {
                sortState.key = key;
                sortState.asc = true;
            }
            paginationState.page = 1; // Reset to page 1 on sort
            applyFilters();
        }

        function changePage(delta) {
            if (delta === 1000) paginationState.page = paginationState.totalPages;
            else if (delta === -1000) paginationState.page = 1;
            else paginationState.page += delta;

            if (paginationState.page < 1) paginationState.page = 1;
            if (paginationState.page > paginationState.totalPages) paginationState.page = paginationState.totalPages;

            renderTable();
            updateStats();
        }

        function changePageSize() {
            paginationState.pageSize = parseInt(document.getElementById('pageSize').value);
            paginationState.page = 1;
            applyFilters();
        }

        function generateTableHeaders() {
            const headerRow = document.createElement('tr');

            // Expand Button Placeholder
            const expandTh = document.createElement('th');
            expandTh.className = 'w-8';
            headerRow.appendChild(expandTh);

            Object.entries(columnState).forEach(([key, config]) => {
                if (!config.visible) return;
                const th = document.createElement('th');
                th.className = 'cursor-pointer hover:bg-slate-700 transition-colors select-none';
                th.onclick = () => setSort(key);

                const isSorting = sortState.key === key;
                th.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span>${config.label}</span>
                        ${isSorting ? `
                            <svg class="w-3 h-3 text-blue-400 ${sortState.asc ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/></svg>
                        ` : `
                            <svg class="w-3 h-3 text-slate-600 opacity-0 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                        `}
                    </div>
                `;

                if (config.align === 'right') th.querySelector('div').classList.add('justify-end');
                headerRow.appendChild(th);
            });
            document.getElementById('tableHeader').replaceChildren(headerRow);
        }

        function applyFilters() {
            const bank = document.getElementById('bankFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const tagValue = document.getElementById('tagFilter').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            // Split and clean tags for filtering
            const tagsToFilter = tagValue ? tagValue.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

            filteredData = allData.filter(t => {
                if (bank && t.bank !== bank) return false;
                if (category === '__unmatched__' && t.matched_category && t.matched_category !== 'Uncategorized') return false;
                if (category && category !== '__unmatched__' && t.matched_category !== category) return false;

                if (tagsToFilter.length > 0) {
                    if (!t.tags) return false;
                    // AND logic: must contain all selected tags
                    if (!tagsToFilter.every(tag => t.tags.includes(tag))) return false;
                }

                if (start && t.date < start) return false;
                if (end && t.date > end) return false;

                if (search) {
                    const tagText = t.tags ? t.tags.join(' ') : '';
                    const haystack = `${t.description} ${t.bank} ${t.matched_rule} ${t.debit} ${t.credit} ${t.ref_number} ${t.matched_category} ${tagText}`.toLowerCase();
                    if (!haystack.includes(search)) return false;
                }
                return true;
            });

            // Sort
            filteredData.sort((a, b) => {
                let valA = a[sortState.key];
                let valB = b[sortState.key];

                if (columnState[sortState.key]?.type === 'rule') {
                    valA = a.extracted_fields?.[columnState[sortState.key].field] || '';
                    valB = b.extracted_fields?.[columnState[sortState.key].field] || '';
                }

                if (sortState.key === 'debit' || sortState.key === 'credit' || sortState.key === 'balance') {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                } else if (sortState.key === 'tags') {
                    valA = (valA || []).join(',').toLowerCase();
                    valB = (valB || []).join(',').toLowerCase();
                } else {
                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();
                }

                if (valA < valB) return sortState.asc ? -1 : 1;
                if (valA > valB) return sortState.asc ? 1 : -1;
                return 0;
            });

            paginationState.totalPages = Math.ceil(filteredData.length / paginationState.pageSize) || 1;
            if (paginationState.page > paginationState.totalPages) paginationState.page = paginationState.totalPages;

            generateTableHeaders();
            renderTable();
            updateStats();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="100" class="py-20 text-center text-slate-500 font-light">No records match your criteria.</td></tr>`;
                return;
            }

            const visibleCols = Object.entries(columnState).filter(([_, c]) => c.visible);

            // Slice data for current page
            const startIdx = (paginationState.page - 1) * paginationState.pageSize;
            const pageData = filteredData.slice(startIdx, startIdx + paginationState.pageSize);

            tbody.innerHTML = pageData.map((row, idx) => {
                const rowId = `row-${idx}`;
                return `
                    <tr onclick="toggleRow('${rowId}')" class="cursor-pointer row-parent" id="parent-${rowId}">
                        <td class="w-8">
                            <svg class="w-4 h-4 text-slate-500 expand-btn" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </td>
                        ${visibleCols.map(([key, config]) => {
                    let value = row[key];
                    let classes = [];

                    // Formatting logic
                    if (config.type === 'rule') {
                        value = (row.extracted_fields && row.extracted_fields[config.field]) || '';
                        classes.push('mono text-xs');
                    }

                    if (key === 'matched_category') {
                        if (row.matched_category) {
                            return `<td><span class="badge" style="background: ${row.matched_category_color}15; color: ${row.matched_category_color}; border: 1px solid ${row.matched_category_color}40">${row.matched_category}</span></td>`;
                        }
                        return `<td class="text-slate-600 text-[10px]">—</td>`;
                    }

                    if (key === 'tags') {
                        if (row.tags && row.tags.length > 0) {
                            const tagChips = row.tags.map(tag => `<span class="inline-block px-2 py-0.5 mr-1 mb-1 text-[9px] bg-blue-600/20 border border-blue-500/30 rounded text-blue-300">${tag}</span>`).join('');
                            return `<td class="max-w-xs">${tagChips}</td>`;
                        }
                        return `<td class="text-slate-600 text-[10px]">—</td>`;
                    }

                    if (key === 'description') {
                        return `<td class="max-w-md truncate font-medium" title="${value}">${value}</td>`;
                    }

                    if (['debit', 'credit', 'balance'].includes(key)) {
                        classes.push('text-right mono tabular-nums');
                        value = value ? currencyFormatter.format(value) : (key === 'balance' ? '0.00' : '');
                        if (key === 'debit' && value) classes.push('text-rose-400');
                        if (key === 'credit' && value) classes.push('text-emerald-400');
                    }

                    if (key === 'date') classes.push('text-slate-400 font-light whitespace-nowrap');
                    if (key === 'bank') classes.push('font-semibold text-xs tracking-wider opacity-80');
                    if (key === 'matched_rule') classes.push('text-[10px] opacity-70');

                    return `<td class="${classes.join(' ')}">${value || ''}</td>`;
                }).join('')}
                    </tr>
                    <tr id="${rowId}" class="row-details">
                        <td colspan="100" class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-4">
                                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Metadata</h4>
                                    <div class="space-y-2 text-sm text-slate-400">
                                        <div class="flex justify-between border-b border-slate-800 pb-1">
                                            <span>Source File</span>
                                            <span class="text-slate-200">${row.source_file || '—'}</span>
                                        </div>
                                        <div class="flex justify-between border-b border-slate-800 pb-1">
                                            <span>Reference No</span>
                                            <span class="text-slate-200">${row.ref_number || '—'}</span>
                                        </div>
                                        <div class="flex justify-between border-b border-slate-800 pb-1">
                                            <span>Legacy Entity</span>
                                            <span class="text-slate-300 font-light italic">${row.entity || '—'}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="md:col-span-2 space-y-4">
                                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Extraction Details</h4>
                                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                                        ${row.matched_rule ? `
                                            <div class="flex items-center gap-2 mb-3">
                                                <span class="text-blue-400 font-bold">${row.matched_rule}</span>
                                                <span class="text-slate-600">→</span>
                                                <span class="badge" style="background: ${row.matched_category_color}15; color: ${row.matched_category_color}">${row.matched_category}</span>
                                            </div>
                                            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                                                ${Object.entries(row.extracted_fields || {}).map(([k, v]) => `
                                                    <div class="p-2 bg-slate-900/50 rounded flex flex-col">
                                                        <span class="text-[10px] uppercase text-slate-500 font-bold tracking-tighter">${k}</span>
                                                        <span class="text-sm mono text-indigo-300 truncate" title="${v}">${v}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : '<span class="text-slate-500 italic">No automated rule matches for this entry.</span>'}
                                    </div>
                                    <div id="remarksContainer-${row.txn_id}" class="space-y-3">
                                         <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Transaction Remarks</h4>
                                         <div class="relative group">
                                             <textarea 
                                                 id="remark-input-${row.txn_id}"
                                                 class="w-full bg-slate-900/80 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/20 transition-all min-h-[80px] custom-scrollbar"
                                                 placeholder="Add your analysis, notes or context here..."
                                             >${row.manual_remarks || ''}</textarea>
                                             <button 
                                                 onclick="saveRemark('${row.txn_id}')"
                                                 id="btn-save-${row.txn_id}"
                                                 class="absolute bottom-3 right-3 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-md text-[10px] font-bold shadow-lg transition-all active:scale-95 disabled:opacity-50"
                                             >
                                                 Save Note
                                             </button>
                                         </div>
                                         <div id="msg-${row.txn_id}" class="text-[10px] h-3 opacity-0 transition-opacity"></div>
                                         ${row.system_remarks ? `
                                            <div class="mt-4 p-3 bg-slate-900/30 border-l-2 border-slate-700 rounded-r-lg">
                                                <h5 class="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-1">Automated System Remarks</h5>
                                                <p class="text-xs text-slate-400 italic">${row.system_remarks}</p>
                                            </div>
                                         ` : ''}
                                     </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function toggleRow(rowId) {
            const detailRow = document.getElementById(rowId);
            const parentRow = document.getElementById(`parent-${rowId}`);
            detailRow.classList.toggle('expanded');
            parentRow.classList.toggle('expanded');
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allData.length.toLocaleString();
            document.getElementById('filteredCount').textContent = filteredData.length.toLocaleString();
            document.getElementById('matchedCount').textContent = filteredData.filter(t => t.matched_rule).length.toLocaleString();

            // Update Pagination UI
            document.getElementById('currentPage').textContent = paginationState.page;
            document.getElementById('totalPages').textContent = paginationState.totalPages;
        }

        async function saveRemark(txnId) {
            const input = document.getElementById(`remark-input-${txnId}`);
            const btn = document.getElementById(`btn-save-${txnId}`);
            const msg = document.getElementById(`msg-${txnId}`);
            const remarks = input.value;

            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const res = await fetch('/api/transactions/remarks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ txn_id: txnId, remarks: remarks })
                });

                const data = await res.json();
                if (data.success) {
                    // Update local data
                    const idx = allData.findIndex(t => t.txn_id === txnId);
                    if (idx !== -1) allData[idx].manual_remarks = remarks;

                    // Message
                    msg.textContent = 'Remark saved successfully';
                    msg.classList.remove('text-red-400');
                    msg.classList.add('text-emerald-400', 'opacity-100');
                    
                    btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    btn.textContent = 'Saved!';

                    setTimeout(() => {
                        msg.classList.remove('opacity-100');
                        btn.classList.replace('bg-emerald-600', 'bg-blue-600');
                        btn.textContent = 'Save Note';
                        btn.disabled = false;
                    }, 2000);
                }
            } catch (err) {
                console.error('Error saving remark:', err);
                msg.textContent = 'Failed to save remark';
                msg.classList.add('text-red-400', 'opacity-100');
                btn.disabled = false;
                btn.textContent = 'Retry Save';
            }
        }

        function downloadCSV() {
            if (!filteredData.length) return;

            const visibleCols = Object.entries(columnState).filter(([_, c]) => c.visible);
            const headers = visibleCols.map(([_, c]) => c.label);

            const csvRows = [headers.join(',')];

            filteredData.forEach(row => {
                const values = visibleCols.map(([key, config]) => {
                    let val = (config.type === 'rule')
                        ? (row.extracted_fields ? row.extracted_fields[config.field] : '')
                        : row[key];

                    val = String(val || '').replace(/"/g, '""');
                    return `"${val}"`;
                });
                csvRows.push(values.join(','));
            });

            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `data_export_${new Date().toISOString().split('T')[0]}.csv`);
            a.click();
        }

        // Run App
        init();
    </script>
</body>

</html>
