<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Transfer Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/common.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <style>
        /* This page uses a slightly larger glass-panel radius than the shared default */
        .glass-panel {
            border-radius: 1.5rem;
        }

        .txn-card {
            background: rgba(28, 28, 30, 0.4);
            border: 1px solid rgba(58, 58, 60, 0.3);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .txn-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(44, 44, 46, 0.4);
        }

        .pair-row {
            animation: slideIn 0.4s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen">


    <div class="page-content p-4 md:p-8">
    <div class="max-w-[98vw] mx-auto space-y-6">
        <!-- Header -->
        <header class="page-hero flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
            <div>
                <h1>Self-Transfer Discovery</h1>
                <p>Audit and reconcile transaction pairs across your accounts.</p>
            </div>
            <button onclick="saveSelectedPairs()" id="saveBtn"
                class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20 active:scale-95 text-sm">
                Confirm All Matches
            </button>
        </header>

        <!-- Filters -->
        <div class="glass-panel p-4 flex flex-wrap items-end gap-6 bg-slate-900/40">
            <div class="flex gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Starting From</label>
                    <input type="date" id="startDate"
                        class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:ring-2 focus:ring-blue-500/20 outline-none w-40">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Ending At</label>
                    <input type="date" id="endDate"
                        class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:ring-2 focus:ring-blue-500/20 outline-none w-40">
                </div>
            </div>

            <div class="h-10 w-[1px] bg-slate-800 hidden lg:block"></div>

            <div class="flex gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">From Bank</label>
                    <select id="fromBankFilter" onchange="applyClientFilters()"
                        class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:ring-2 focus:ring-blue-500/20 outline-none w-44">
                        <option value="">Any Bank</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">To Bank</label>
                    <select id="toBankFilter" onchange="applyClientFilters()"
                        class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs focus:ring-2 focus:ring-blue-500/20 outline-none w-44">
                        <option value="">Any Bank</option>
                    </select>
                </div>
            </div>

            <button onclick="findMatches()"
                class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/20 active:scale-95 flex items-center gap-2 text-sm ml-auto">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                Run Search
            </button>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="space-y-3">
            <!-- Initial State -->
            <div class="py-32 text-center opacity-40">
                <div class="flex justify-center mb-4 text-slate-600">
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                            d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                </div>
                <h3 class="text-xl font-medium">Select a date range to begin scanning</h3>
            </div>
        </div>

        <!-- Empty State (Hidden) -->
        <div id="emptyState" class="hidden py-32 text-center">
            <h3 class="text-xl font-medium text-slate-600">No new transfers discovered</h3>
        </div>
    </div>
    </div>

    <script>
        let allMatches = [];

        async function init() {
            try {
                const [metaRes, bankRes] = await Promise.all([
                    fetch('/api/self-transfers/meta'),
                    fetch('/api/banks')
                ]);
                
                const meta = await metaRes.json();
                document.getElementById('startDate').value = meta.start_date;
                document.getElementById('endDate').value = meta.end_date;

                const banks = await bankRes.json();
                const bankOpts = banks.map(b => `<option value="${b.Name}">${b.Name}</option>`).join('');
                document.getElementById('fromBankFilter').innerHTML += bankOpts;
                document.getElementById('toBankFilter').innerHTML += bankOpts;

            } catch (e) { console.error(e); }
        }

        async function findMatches() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const container = document.getElementById('resultsContainer');

            container.innerHTML = `<div class="py-32 flex justify-center"><svg class="w-10 h-10 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>`;

            try {
                const res = await fetch(`/api/self-transfers/search?start_date=${start}&end_date=${end}`);
                allMatches = await res.json();
                applyClientFilters();
                
                if (allMatches.length > 0) {
                    document.getElementById('saveBtn').classList.remove('hidden');
                } else {
                    document.getElementById('saveBtn').classList.add('hidden');
                }
            } catch (e) {
                container.innerHTML = `<div class="p-8 text-rose-400 font-bold border border-rose-500/20 bg-rose-500/5 rounded-2xl">Error: ${e.message}</div>`;
            }
        }

        function applyClientFilters() {
            const fromBank = document.getElementById('fromBankFilter').value;
            const toBank = document.getElementById('toBankFilter').value;
            
            let filtered = allMatches;
            if (fromBank) filtered = filtered.filter(p => p.debit_txn.Bank === fromBank);
            if (toBank) filtered = filtered.filter(p => p.credit_txn.Bank === toBank);
            
            renderMatches(filtered);
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.pair-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checked = document.querySelectorAll('.pair-checkbox:checked').length;
            const btn = document.getElementById('saveBtn');
            if (checked > 0) {
                btn.classList.remove('hidden');
                btn.innerText = `Confirm ${checked} Selected ${checked === 1 ? 'Match' : 'Matches'}`;
            } else {
                btn.classList.add('hidden');
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById('resultsContainer');
            if (matches.length === 0) {
                container.innerHTML = document.getElementById('emptyState').innerHTML;
                document.getElementById('saveBtn').classList.add('hidden');
                return;
            }

            const header = `
                <div class="flex items-center gap-4 px-6 py-2 bg-slate-900/60 border border-slate-800 rounded-xl mb-4">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" 
                           class="w-5 h-5 rounded border-slate-700 bg-slate-950 text-blue-600 focus:ring-blue-500/20">
                    <label for="selectAll" class="text-xs font-bold text-slate-400 uppercase tracking-widest cursor-pointer select-none">Select All Results</label>
                    <span class="ml-auto text-[10px] font-bold text-slate-600 uppercase tracking-widest">${matches.length} matches discovered</span>
                </div>
            `;

            container.innerHTML = header + matches.map((pair, idx) => `
                <div class="pair-row grid grid-cols-[auto_1fr_auto_1fr_auto] items-center gap-2 bg-slate-900/30 p-2 rounded-2xl border border-slate-800/80 hover:border-blue-500/30 transition-all">
                    <!-- SELECT -->
                    <div class="pl-4 pr-2">
                        <input type="checkbox" class="pair-checkbox w-5 h-5 rounded border-slate-700 bg-slate-950 text-blue-600 focus:ring-blue-500/20" 
                               data-id="${pair.pair_id}" onchange="updateSelectedCount()">
                    </div>

                    <!-- DEBIT (FROM) -->
                    <div class="txn-card p-3 relative overflow-hidden bg-slate-950/40">
                         <div class="absolute top-0 left-0 w-1 h-full bg-rose-500/30"></div>
                         <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">${pair.debit_txn.Bank}</span>
                            <span class="text-xs font-bold text-slate-300">${pair.debit_txn.Date}</span>
                         </div>
                         <div class="text-sm font-semibold text-slate-200 truncate" title="${pair.debit_txn.Description}">${pair.debit_txn.Description}</div>
                    </div>

                    <!-- ARROW -->
                    <div class="flex items-center px-1">
                        <div class="w-6 h-6 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500/60">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </div>
                    </div>

                    <!-- CREDIT (TO) -->
                    <div class="txn-card p-3 relative overflow-hidden bg-slate-950/40">
                         <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500/30"></div>
                         <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">${pair.credit_txn.Bank}</span>
                            <span class="text-xs font-bold text-slate-300">${pair.credit_txn.Date}</span>
                         </div>
                         <div class="text-sm font-semibold text-slate-200 truncate" title="${pair.credit_txn.Description}">${pair.credit_txn.Description}</div>
                    </div>

                    <!-- AMOUNT (CONSOLIDATED) -->
                    <div class="px-6 text-right min-w-[140px]">
                        <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-0.5">Transfer Amount</div>
                        <div class="text-xl font-black tabular-nums text-blue-400">₹${pair.debit_txn.Debit.toLocaleString()}</div>
                    </div>
                </div>
            `).join('');

            updateSelectedCount();
        }

        async function saveSelectedPairs() {
            const checked = Array.from(document.querySelectorAll('.pair-checkbox:checked')).map(cb => cb.dataset.id);
            if (checked.length === 0) return;

            const toSave = allMatches.filter(p => checked.includes(p.pair_id));

            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.innerHTML = `<svg class="w-3 h-3 animate-spin inline mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Saving...`;
            btn.disabled = true;

            try {
                const res = await fetch('/api/self-transfers/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(toSave)
                });
                const result = await res.json();
                
                btn.className = "bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold transition-all";
                btn.innerHTML = `<svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg> Confirmed!`;
                
                setTimeout(() => {
                    findMatches(); // Refresh results
                    btn.disabled = false;
                    btn.className = "hidden bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20 active:scale-95 text-sm";
                }, 1500);

            } catch (e) {
                alert("Failed to save: " + e.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        init();
    </script>
</body>

</html>
