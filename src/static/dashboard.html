<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Statement Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #f3f4f6;
        }

        .card {
            background: #1f2937;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        input,
        select {
            background-color: #374151;
            border: 1px solid #4b5563;
            color: #f3f4f6;
            padding: 0.5rem;
            border-radius: 0.375rem;
        }

        /* Dropdown Styles */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #1f2937;
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            margin-top: 0.25rem;
            padding: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .dropdown:hover .dropdown-content,
        .dropdown:focus-within .dropdown-content {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 p-6">

    <div class="max-w-7xl mx-auto space-y-6">

        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center space-x-4">
                <h1 class="text-3xl font-bold text-white">Financial Overview</h1>
                <a href="/data"
                    class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm font-medium transition">Data Grid</a>
                <a href="/rules"
                    class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm font-medium transition">Rules</a>
                <a href="/reconcile"
                    class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm font-medium transition">Reconcile</a>
            </div>

            <div class="flex flex-wrap items-center gap-4">
                <!-- Multiselect Bank -->
                <div class="dropdown relative inline-block">
                    <button
                        class="bg-gray-700 text-white px-4 py-2 rounded border border-gray-600 flex items-center gap-2 hover:bg-gray-600 transition">
                        Select Banks <span id="bankCount"
                            class="text-xs bg-blue-600 px-2 py-0.5 rounded-full font-bold">All</span>
                    </button>
                    <div id="bankDropdown" class="dropdown-content">
                        <div id="individualBanks"></div>
                    </div>
                </div>

                <div class="flex items-center space-x-2 bg-gray-800 p-1 rounded-md border border-gray-700">
                    <span class="text-xs text-gray-400 px-2 font-semibold uppercase tracking-wider">From:</span>
                    <input type="date" id="startDate" class="bg-transparent border-0 focus:ring-0 text-sm"
                        onchange="applyFilters()">
                </div>
                <div class="flex items-center space-x-2 bg-gray-800 p-1 rounded-md border border-gray-700">
                    <span class="text-xs text-gray-400 px-2 font-semibold uppercase tracking-wider">To:</span>
                    <input type="date" id="endDate" class="bg-transparent border-0 focus:ring-0 text-sm"
                        onchange="applyFilters()">
                </div>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="card border-l-4 border-green-500">
                <p class="text-gray-400 text-sm">Total Credit</p>
                <p class="text-2xl font-bold text-green-400" id="totalCredit">₹0</p>
            </div>
            <div class="card border-l-4 border-red-500">
                <p class="text-gray-400 text-sm">Total Debit</p>
                <p class="text-2xl font-bold text-red-400" id="totalDebit">₹0</p>
            </div>
            <div class="card border-l-4 border-blue-500">
                <p class="text-gray-400 text-sm">Net Flow</p>
                <p class="text-2xl font-bold text-blue-400" id="netFlow">₹0</p>
            </div>
            <div class="card border-l-4 border-purple-500">
                <p class="text-gray-400 text-sm">Txn Count</p>
                <p class="text-2xl font-bold text-gray-300" id="txnCount">0</p>
            </div>
        </div>

        <!-- Main Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card">
                <h3 class="font-semibold mb-4 text-lg">Daily Income vs Expense</h3>
                <canvas id="dailyChart"></canvas>
            </div>
            <div class="card">
                <h3 class="font-semibold mb-4 text-lg">Cumulative Balance Trend</h3>
                <canvas id="balanceChart"></canvas>
            </div>
        </div>

        <!-- Secondary Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="card lg:col-span-1">
                <h3 class="font-semibold mb-4 text-lg">Category Distribution</h3>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="card lg:col-span-2">
                <h3 class="font-semibold mb-4 text-lg">Top Categories (Debit)</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm text-left text-gray-300">
                        <thead class="bg-gray-700 border-b border-gray-600">
                            <tr>
                                <th class="px-4 py-2">Category</th>
                                <th class="px-4 py-2 text-right">Amount</th>
                                <th class="px-4 py-2 text-right">%</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Logic -->
    <script>
        let rawData = [];
        let filteredData = [];
        let charts = {};

        const currencyFormatter = new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            Chart.defaults.color = '#9ca3af';
            Chart.defaults.borderColor = '#374151';
            fetchData();
        });

        async function fetchData() {
            try {
                const response = await fetch('/data.csv');
                const text = await response.text();

                Papa.parse(text, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: function (results) {
                        rawData = results.data.map(row => ({
                            ...row,
                            DateObj: new Date(row.Date),
                            Debit: parseFloat(String(row.Debit).replace(/,/g, '')) || 0,
                            Credit: parseFloat(String(row.Credit).replace(/,/g, '')) || 0,
                            Balance: parseFloat(String(row.Balance).replace(/,/g, '')) || 0
                        }));

                        // Sort by date
                        rawData.sort((a, b) => a.DateObj - b.DateObj);

                        initFilters();
                        applyFilters();
                    }
                });
            } catch (error) {
                console.error("Error loading data:", error);
                alert("Failed to load data. Make sure server is running.");
            }
        }

        function initFilters() {
            // 1. Set Indian Financial Year Defaults
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            let startYear = now.getFullYear();
            if (currentMonth < 4) startYear--; // FY starts April 1st

            document.getElementById('startDate').value = `${startYear}-04-01`;
            document.getElementById('endDate').value = `${startYear + 1}-03-31`;

            // 2. Populate bank multiselect (None checked by default)
            const banks = [...new Set(rawData.map(d => d.Bank))].filter(Boolean).sort();
            const container = document.getElementById('individualBanks');
            container.innerHTML = '';

            banks.forEach(bank => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 p-1 hover:bg-gray-600 rounded cursor-pointer";
                label.innerHTML = `
                    <input type="checkbox" class="bank-checkbox" value="${bank}" onchange="updateBankCount()"> 
                    <span class="text-sm">${bank}</span>
                `;
                container.appendChild(label);
            });
            updateBankCount();
        }



        function updateBankCount() {
            const checked = document.querySelectorAll('.bank-checkbox:checked').length;
            const badge = document.getElementById('bankCount');

            if (checked === 0) badge.textContent = 'All';
            else badge.textContent = checked;

            applyFilters();
        }

        function applyFilters() {
            // Get selected banks
            const selectedBanks = Array.from(document.querySelectorAll('.bank-checkbox:checked')).map(cb => cb.value);
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            if (!isNaN(end)) end.setHours(23, 59, 59);

            filteredData = rawData.filter(row => {
                if (!row.DateObj || isNaN(row.DateObj)) return false;

                const dateMatch = (isNaN(start) || row.DateObj >= start) && (isNaN(end) || row.DateObj <= end);

                // None selected = All selected
                const bankMatch = selectedBanks.length === 0 || selectedBanks.includes(row.Bank);

                return dateMatch && bankMatch;
            });

            updateMetrics();
            updateCharts();
        }

        function updateMetrics() {
            const totalCr = filteredData.reduce((sum, r) => sum + r.Credit, 0);
            const totalDr = filteredData.reduce((sum, r) => sum + r.Debit, 0);
            const net = totalCr - totalDr;

            document.getElementById('totalCredit').textContent = currencyFormatter.format(totalCr);
            document.getElementById('totalDebit').textContent = currencyFormatter.format(totalDr);
            document.getElementById('netFlow').textContent = currencyFormatter.format(net);
            document.getElementById('txnCount').textContent = filteredData.length;

            // Color Net Flow
            const netEl = document.getElementById('netFlow');
            netEl.className = `text-2xl font-bold ${net >= 0 ? 'text-blue-400' : 'text-red-400'}`;
        }

        function updateCharts() {
            renderDailyChart();
            renderBalanceChart();
            renderCategoryChart();
        }

        function renderDailyChart() {
            // Group by Date
            const daily = {};
            filteredData.forEach(row => {
                const dateKey = row.DateObj.toISOString().split('T')[0];
                if (!daily[dateKey]) daily[dateKey] = { cr: 0, dr: 0 };
                daily[dateKey].cr += row.Credit;
                daily[dateKey].dr += row.Debit;
            });

            const labels = Object.keys(daily).sort();
            const dataCr = labels.map(d => daily[d].cr);
            const dataDr = labels.map(d => daily[d].dr);

            const ctx = document.getElementById('dailyChart').getContext('2d');
            if (charts.daily) charts.daily.destroy();

            charts.daily = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Income', data: dataCr, backgroundColor: '#22c55e' },
                        { label: 'Expense', data: dataDr, backgroundColor: '#ef4444' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: false },
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function renderBalanceChart() {
            // For Balance, we can't just sum filtered rows if we filter by date because balance is cumulative.
            // Ideally balance should come from the 'Balance' column of the LAST transaction of that day.
            // If filtering by bank, use raw balance? Or re-calculate?
            // Using raw balance is tricky if multiple banks are selected (sum of balances?).
            // Let's approximate: Sum of balances of last transaction per bank for that day?
            // Or simpler: Just track cumulative Net Flow relative to start of period? 
            // Let's stick to valid "Balance" column if 1 bank picked, else cumulative Net Flow.

            const selectedBanks = Array.from(document.querySelectorAll('.bank-checkbox:checked')).map(cb => cb.value);
            let labels = [];
            let data = [];

            if (selectedBanks.length === 1) {
                // Single bank mode: visualising the Balance column
                // Group by date, take LAST balance
                const dailyBal = {};
                filteredData.forEach(row => {
                    const dateKey = row.DateObj.toISOString().split('T')[0];
                    dailyBal[dateKey] = row.Balance; // Overwrite, so last one stays (since sorted)
                });
                labels = Object.keys(dailyBal).sort();
                data = labels.map(d => dailyBal[d]);
            } else {
                // All banks: Visualise cumulative Net Flow over the period
                // Start from 0
                let runBal = 0;
                const dailyNet = {};

                filteredData.forEach(row => {
                    const dateKey = row.DateObj.toISOString().split('T')[0];
                    if (!dailyNet[dateKey]) dailyNet[dateKey] = 0;
                    dailyNet[dateKey] += (row.Credit - row.Debit);
                });

                labels = Object.keys(dailyNet).sort();
                data = labels.map(d => {
                    runBal += dailyNet[d];
                    return runBal;
                });
            }

            const ctx = document.getElementById('balanceChart').getContext('2d');
            if (charts.balance) charts.balance.destroy();

            charts.balance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: selectedBanks.length === 1 ? 'Closing Balance' : 'Cumulative Net Flow',
                        data: data,
                        borderColor: '#3b82f6',
                        tension: 0.1,
                        fill: true,
                        backgroundColor: 'rgba(59, 130, 246, 0.1)'
                    }]
                },
                options: { responsive: true }
            });
        }

        function renderCategoryChart() {
            // Group Debits by Category
            const cats = {};
            let totalDr = 0;

            filteredData.forEach(row => {
                if (row.Debit > 0) {
                    const cat = row.Category || 'Uncategorized';
                    if (!cats[cat]) cats[cat] = 0;
                    cats[cat] += row.Debit;
                    totalDr += row.Debit;
                }
            });

            // Sort top 10
            const sortedCats = Object.entries(cats).sort((a, b) => b[1] - a[1]);

            // Populating Chart
            const labels = sortedCats.map(x => x[0]);
            const values = sortedCats.map(x => x[1]);

            const ctx = document.getElementById('categoryChart').getContext('2d');
            if (charts.category) charts.category.destroy();

            charts.category = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981',
                            '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef', '#94a3b8'
                        ]
                    }]
                }
            });

            // Populate Table
            const tbody = document.getElementById('categoryTableBody');
            tbody.innerHTML = '';
            sortedCats.forEach(([cat, amount]) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-700 hover:bg-gray-700/50";
                tr.innerHTML = `
                    <td class="px-4 py-2 text-gray-300">${cat}</td>
                    <td class="px-4 py-2 text-right text-white font-medium">${currencyFormatter.format(amount)}</td>
                    <td class="px-4 py-2 text-right text-gray-400">${((amount / totalDr) * 100).toFixed(1)}%</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>

</html>
