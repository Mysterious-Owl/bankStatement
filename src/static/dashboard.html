<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <style>
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        /* Segmented range presets */
        .segmented {
            display: inline-flex;
            padding: 3px;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color-strong);
        }

        .segmented button {
            height: calc(var(--control-height) - 8px);
            padding: 0 0.7rem;
            border-radius: 7px;
            font-size: 0.75rem;
            font-weight: 550;
            color: var(--text-secondary);
            transition: background-color 0.15s var(--ease-apple), color 0.15s var(--ease-apple);
        }

        .segmented button:hover { color: var(--text-primary); }

        .segmented button.is-on {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .date-pair {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--text-tertiary);
            font-size: 0.75rem;
        }

        .date-pair input { width: 9.25rem; }

        /* Bank multi-select */
        .menu { position: relative; }

        .menu-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 30;
            min-width: 13rem;
            padding: 0.375rem;
            border-radius: var(--radius-lg);
            background: var(--surface-overlay);
            backdrop-filter: blur(20px) saturate(170%);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
            box-shadow: var(--shadow-overlay);
        }

        .menu-panel label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            cursor: pointer;
        }

        .menu-panel label:hover { background: rgba(255, 255, 255, 0.06); }

        .count-badge {
            min-width: 1.25rem;
            height: 1.25rem;
            padding: 0 0.375rem;
            border-radius: 6px;
            background: var(--accent-soft);
            color: #7cb8ff;
            font-size: 0.6875rem;
            font-weight: 650;
            display: inline-grid;
            place-items: center;
        }

        /* KPI tiles */
        .kpis {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.75rem;
        }

        @media (max-width: 1024px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }

        .kpi {
            padding: 1rem 1.125rem;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        .kpi-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 550;
            color: var(--text-secondary);
        }

        .kpi-value {
            margin-top: 0.5rem;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .kpi-sub {
            margin-top: 0.375rem;
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .key-dot {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 2px;
            margin-right: 0.4rem;
            vertical-align: middle;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.6875rem;
            font-weight: 500;
            color: var(--text-tertiary);
            cursor: pointer;
        }

        /* Panels */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .panel-head h2 {
            font-size: 0.9375rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .panel-head .link {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-decoration: none;
            white-space: nowrap;
        }

        .panel-head .link:hover { color: var(--text-primary); }

        /* Panels are flex columns so a chart grows to match a taller
           neighbour in the same row instead of leaving dead space. */
        .panel { display: flex; flex-direction: column; }
        .chart-box { position: relative; flex: 1 1 auto; min-height: 16rem; }

        /* Needs attention */
        .attention-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.7rem 0.25rem;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            border-radius: var(--radius-sm);
            transition: background-color 0.15s var(--ease-apple);
        }

        .attention-row:last-child { border-bottom: none; }
        .attention-row:hover { background: rgba(255, 255, 255, 0.03); }

        .status-icon {
            flex: 0 0 1.375rem;
            height: 1.375rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            font-size: 0.6875rem;
            font-weight: 800;
            margin-top: 0.0625rem;
        }

        .status-icon.is-bad  { background: rgba(255, 69, 58, 0.16);  color: var(--bad); }
        .status-icon.is-warn { background: rgba(255, 159, 10, 0.16); color: var(--warn); }
        .status-icon.is-info { background: rgba(100, 210, 255, 0.14); color: var(--info); }
        .status-icon.is-ok   { background: rgba(48, 209, 88, 0.16);  color: var(--ok); }

        .attention-title { font-size: 0.8125rem; font-weight: 550; }
        .attention-detail { font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.125rem; }

        .attention-row .chev {
            margin-left: auto;
            color: var(--text-tertiary);
            align-self: center;
        }

        /* Bar lists (where it went, tags) */
        .bar-row { padding: 0.5rem 0; }
        .bar-row + .bar-row { border-top: 1px solid rgba(255, 255, 255, 0.04); }

        .bar-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            font-size: 0.8125rem;
        }

        .bar-line .amt { font-variant-numeric: tabular-nums; font-weight: 550; }
        .bar-line .pct { color: var(--text-tertiary); font-size: 0.75rem; margin-left: 0.375rem; font-variant-numeric: tabular-nums; }

        .bar-track {
            margin-top: 0.375rem;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .bar-track > span {
            display: block;
            height: 100%;
            border-radius: 999px;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite linear;
            border-radius: 6px;
            color: transparent !important;
        }

        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
    </style>
</head>

<body class="min-h-screen">
    <div class="page-content p-4 md:p-8">
    <div class="space-y-6">

        <header class="page-hero flex flex-col lg:flex-row justify-between items-start lg:items-end gap-4 !mb-2">
            <div>
                <h1>Dashboard</h1>
                <p id="coverageLine">Income, spending, and what needs your attention.</p>
            </div>
            <div class="toolbar">
                <div class="menu" id="bankMenu">
                    <button type="button" class="btn-secondary" onclick="toggleBankMenu()" aria-haspopup="true" aria-expanded="false" id="bankMenuBtn">
                        Banks <span class="count-badge" id="bankCount">All</span>
                    </button>
                    <div class="menu-panel hidden" id="bankPanel"></div>
                </div>
                <div class="segmented" role="group" aria-label="Date range">
                    <button type="button" data-range="3">3M</button>
                    <button type="button" data-range="6">6M</button>
                    <button type="button" data-range="12">12M</button>
                    <button type="button" data-range="fy">FY</button>
                    <button type="button" data-range="all">All</button>
                </div>
                <div class="date-pair">
                    <input type="date" id="startDate" aria-label="From" onchange="customRange()">
                    <span>–</span>
                    <input type="date" id="endDate" aria-label="To" onchange="customRange()">
                </div>
            </div>
        </header>

        <!-- KPIs -->
        <section class="kpis" aria-label="Key figures">
            <div class="kpi">
                <div class="kpi-label"><span><span class="key-dot" style="background:#30d158"></span>Income</span></div>
                <div class="kpi-value" id="kpiIncome">–</div>
                <div class="kpi-sub" id="kpiIncomeSub">&nbsp;</div>
            </div>
            <div class="kpi">
                <div class="kpi-label"><span><span class="key-dot" style="background:#ff453a"></span>Spending</span></div>
                <div class="kpi-value" id="kpiSpend">–</div>
                <div class="kpi-sub" id="kpiSpendSub">&nbsp;</div>
            </div>
            <div class="kpi">
                <div class="kpi-label"><span>Net saved</span></div>
                <div class="kpi-value" id="kpiNet">–</div>
                <div class="kpi-sub" id="kpiNetSub">&nbsp;</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">
                    <span>Self transfers</span>
                    <label class="toggle" title="Count transfers between your own accounts inside income and spending">
                        <input type="checkbox" id="includeTransfers" onchange="loadSummary()"> include
                    </label>
                </div>
                <div class="kpi-value" id="kpiTransfers">–</div>
                <div class="kpi-sub" id="kpiTransfersSub">&nbsp;</div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="panel lg:col-span-2">
                <div class="panel-head">
                    <h2>Income and spending by month</h2>
                    <a class="link" href="/insights">Trends by category →</a>
                </div>
                <div class="chart-box"><canvas id="monthlyChart" aria-label="Monthly income and spending"></canvas></div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Needs attention</h2>
                    <span class="link">whole ledger</span>
                </div>
                <div id="attention">
                    <div class="skeleton h-10 mb-2"></div><div class="skeleton h-10 mb-2"></div><div class="skeleton h-10"></div>
                </div>
            </section>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="panel lg:col-span-2">
                <div class="panel-head">
                    <h2>Balance across banks</h2>
                    <span class="link" id="balanceNow"></span>
                </div>
                <div class="chart-box"><canvas id="cashChart" aria-label="Total balance across selected banks"></canvas></div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Where it went</h2>
                    <a class="link" href="/budgets">Budgets →</a>
                </div>
                <div id="categoryList"></div>
            </section>
        </div>

        <section class="panel">
            <div class="panel-head">
                <h2>Top tags</h2>
                <a class="link" href="/tags">Manage tags →</a>
            </div>
            <div id="tagList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-8"></div>
        </section>
    </div>
    </div>

    <script>
        const esc = App.escapeHtml;
        const { money, fmtDate, monthLabel, compactMoney } = App;
        const INCOME = '#30d158';
        const SPENDING = '#ff453a';
        const ACCENT = '#0a84ff';

        let charts = {};
        let ledgerRange = null;   // {min, max} of the whole ledger
        let activeRange = '12';
        let categoryColors = {};

        document.addEventListener('DOMContentLoaded', async () => {
            Chart.defaults.color = '#71717a';
            Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
            Chart.defaults.font.family = 'Inter, -apple-system, sans-serif';
            Chart.defaults.font.size = 11;

            document.querySelectorAll('.segmented button').forEach(b =>
                b.addEventListener('click', () => setRange(b.dataset.range)));
            document.addEventListener('click', e => {
                if (!document.getElementById('bankMenu').contains(e.target)) closeBankMenu();
            });

            App.api('/api/categories').then(cats => {
                categoryColors = Object.fromEntries(cats.map(c => [c.name, c.color]));
            }).catch(() => {});

            // First call without dates: learn the ledger's span and bank list,
            // then default to the last 12 months *of data*, not of the calendar.
            let first;
            try { first = await App.api('/api/dashboard/summary'); }
            catch (err) { return showEmpty(`Couldn't load the dashboard: ${err.message}`); }
            if (first.error) return showEmpty();

            ledgerRange = first.date_range;
            populateBanks(first.banks);
            document.getElementById('coverageLine').textContent =
                `Statements from ${fmtDate(ledgerRange.min)} to ${fmtDate(ledgerRange.max)}.`;
            setRange('12');
            loadAttention();
        });

        function showEmpty(message) {
            document.getElementById('coverageLine').innerHTML = message
                ? esc(message)
                : 'No statements yet. <a href="/upload" class="text-blue-400">Upload your first statements</a> to see your finances here.';
            document.getElementById('attention').innerHTML = '<div class="attention-detail">Nothing to check until statements are uploaded.</div>';
        }

        function iso(d) {
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        /* --- Filters -------------------------------------------------- */

        function setRange(range) {
            activeRange = range;
            document.querySelectorAll('.segmented button').forEach(b =>
                b.classList.toggle('is-on', b.dataset.range === range));
            if (!ledgerRange || !ledgerRange.max) return;

            const end = new Date(ledgerRange.max + 'T00:00:00');
            let start;
            if (range === 'all') {
                start = new Date(ledgerRange.min + 'T00:00:00');
            } else if (range === 'fy') {
                // Indian financial year (Apr-Mar) containing the latest data.
                const fyStartYear = end.getMonth() >= 3 ? end.getFullYear() : end.getFullYear() - 1;
                start = new Date(fyStartYear, 3, 1);
            } else {
                start = new Date(end);
                start.setMonth(start.getMonth() - Number(range));
                start.setDate(start.getDate() + 1);
            }
            document.getElementById('startDate').value = iso(start);
            document.getElementById('endDate').value = iso(end);
            loadSummary();
        }

        function customRange() {
            activeRange = null;
            document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('is-on'));
            loadSummary();
        }

        function populateBanks(banks) {
            document.getElementById('bankPanel').innerHTML = banks.map(b =>
                `<label><input type="checkbox" class="bank-checkbox" value="${esc(b)}" onchange="updateBankCount()"> ${esc(b)}</label>`).join('');
        }

        function toggleBankMenu() {
            const panel = document.getElementById('bankPanel');
            const open = panel.classList.toggle('hidden') === false;
            document.getElementById('bankMenuBtn').setAttribute('aria-expanded', open);
        }

        function closeBankMenu() {
            document.getElementById('bankPanel').classList.add('hidden');
            document.getElementById('bankMenuBtn').setAttribute('aria-expanded', 'false');
        }

        function selectedBanks() {
            return [...document.querySelectorAll('.bank-checkbox:checked')].map(cb => cb.value);
        }

        function updateBankCount() {
            const n = selectedBanks().length;
            document.getElementById('bankCount').textContent = n === 0 ? 'All' : n;
            loadSummary();
        }

        /* --- Summary -------------------------------------------------- */

        async function loadSummary() {
            const params = new URLSearchParams({
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                include_transfers: document.getElementById('includeTransfers').checked
            });
            const banks = selectedBanks();
            if (banks.length) params.set('banks', banks.join(','));

            let data;
            try { data = await App.api(`/api/dashboard/summary?${params}`); }
            catch (err) { return console.error('Dashboard error:', err); }
            if (data.error) return;

            renderKpis(data);
            renderMonthly(data.monthly);
            renderCash(data.cash_availability);
            renderCategories(data.categories, data.metrics.total_debit);
            renderTags(data.tags);
        }

        function renderKpis(data) {
            const m = data.metrics;
            const months = Math.max(1, data.monthly.labels.length);

            document.getElementById('kpiIncome').textContent = money(m.total_credit);
            document.getElementById('kpiIncomeSub').textContent = `${money(m.total_credit / months)} a month on average`;
            document.getElementById('kpiSpend').textContent = money(m.total_debit);
            document.getElementById('kpiSpendSub').textContent = `${money(m.total_debit / months)} a month · ${m.txn_count.toLocaleString('en-IN')} transactions`;

            const net = document.getElementById('kpiNet');
            net.textContent = (m.net_flow < 0 ? '−' : '') + money(Math.abs(m.net_flow));
            net.style.color = m.net_flow < 0 ? 'var(--bad)' : '';
            const rate = m.total_credit > 0 ? Math.round(100 * m.net_flow / m.total_credit) : null;
            document.getElementById('kpiNetSub').textContent = rate == null
                ? 'no income in this range'
                : `${rate}% of income saved`;

            const t = data.transfers || { total_moved: 0, pair_count: 0, routes: [] };
            document.getElementById('kpiTransfers').textContent = money(t.total_moved);
            const route = t.routes[0] ? ` · mostly ${t.routes[0].from} → ${t.routes[0].to}` : '';
            document.getElementById('kpiTransfersSub').textContent = t.pair_count === 0
                ? 'none confirmed yet'
                : `${t.pair_count} transfer${t.pair_count === 1 ? '' : 's'} · ${t.included_in_totals ? 'counted' : 'not counted'} above${route}`;
        }

        function renderMonthly(monthly) {
            if (charts.monthly) charts.monthly.destroy();
            const net = monthly.credit.map((c, i) => c - monthly.debit[i]);
            charts.monthly = new Chart(document.getElementById('monthlyChart'), {
                type: 'bar',
                data: {
                    labels: monthly.labels.map(monthLabel),
                    datasets: [
                        { label: 'Income', data: monthly.credit, backgroundColor: INCOME, borderRadius: 4, maxBarThickness: 18, categoryPercentage: 0.7, barPercentage: 0.9 },
                        { label: 'Spending', data: monthly.debit, backgroundColor: SPENDING, borderRadius: 4, maxBarThickness: 18, categoryPercentage: 0.7, barPercentage: 0.9 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10 } },
                        tooltip: {
                            callbacks: {
                                label: ctx => ` ${ctx.dataset.label}: ${money(ctx.parsed.y)}`,
                                footer: items => `Net: ${money(net[items[0].dataIndex])}`
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: { beginAtZero: true, border: { display: false }, ticks: { callback: compactMoney, maxTicksLimit: 5 } }
                    }
                }
            });
        }

        function renderCash(cash) {
            if (charts.cash) charts.cash.destroy();
            const last = cash.data.length ? cash.data[cash.data.length - 1] : null;
            document.getElementById('balanceNow').textContent = last == null ? '' : `${money(last)} on ${fmtDate(cash.labels[cash.labels.length - 1])}`;

            const ctx = document.getElementById('cashChart').getContext('2d');
            const fill = ctx.createLinearGradient(0, 0, 0, 256);
            fill.addColorStop(0, 'rgba(10, 132, 255, 0.22)');
            fill.addColorStop(1, 'rgba(10, 132, 255, 0)');

            charts.cash = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: cash.labels,
                    datasets: [{ label: 'Balance', data: cash.data, borderColor: ACCENT, backgroundColor: fill, fill: true, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.25 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { title: items => fmtDate(items[0].label), label: ctx => ` ${money(ctx.parsed.y)}` } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 8, callback: function (v) { return monthLabel(this.getLabelForValue(v).slice(0, 7)); } } },
                        y: { border: { display: false }, ticks: { callback: compactMoney, maxTicksLimit: 5 } }
                    }
                }
            });
        }

        function renderCategories(cats, totalSpend) {
            const el = document.getElementById('categoryList');
            if (!cats.labels.length) {
                el.innerHTML = '<div class="attention-detail">No spending in this range.</div>';
                return;
            }
            const rows = cats.labels.map((name, i) => ({ name, value: cats.values[i] }));
            const shown = rows.slice(0, 7);
            const rest = rows.slice(7).reduce((s, r) => s + r.value, 0);
            if (rest > 0) shown.push({ name: `${rows.length - 7} more`, value: rest, other: true });
            const peak = Math.max(...shown.map(r => r.value), 1);

            el.innerHTML = shown.map(r => {
                const color = r.other ? '#52525b' : (categoryColors[r.name] || '#71717a');
                const pct = totalSpend > 0 ? Math.round(100 * r.value / totalSpend) : 0;
                return `<div class="bar-row">
                    <div class="bar-line"><span>${esc(r.name)}</span><span><span class="amt">${money(r.value)}</span><span class="pct">${pct}%</span></span></div>
                    <div class="bar-track"><span style="width:${100 * r.value / peak}%;background:${esc(color)}"></span></div>
                </div>`;
            }).join('');
        }

        function renderTags(tags) {
            const el = document.getElementById('tagList');
            if (!tags.labels.length) {
                el.innerHTML = '<div class="attention-detail">No tagged transactions in this range. <a href="/data?view=grid" class="text-blue-400">Tag some in the Data Grid</a>.</div>';
                return;
            }
            const peak = Math.max(...tags.values, 1);
            el.innerHTML = tags.labels.map((t, i) => `
                <div class="bar-row">
                    <div class="bar-line"><span class="tag-chip !m-0">${esc(t)}</span><span class="amt">${tags.values[i]}</span></div>
                    <div class="bar-track"><span style="width:${100 * tags.values[i] / peak}%;background:${ACCENT}"></span></div>
                </div>`).join('');
        }

        /* --- Needs attention ----------------------------------------- */

        const ICONS = { bad: '!', warn: '!', info: 'i', ok: '✓' };

        function attentionRow(level, title, detail, href) {
            return `<a class="attention-row" href="${href}">
                <span class="status-icon is-${level}" aria-label="${level === 'ok' ? 'ok' : level === 'info' ? 'note' : 'warning'}">${ICONS[level]}</span>
                <span><div class="attention-title">${title}</div>${detail ? `<div class="attention-detail">${detail}</div>` : ''}</span>
                <span class="chev" aria-hidden="true">›</span>
            </a>`;
        }

        async function loadAttention() {
            const get = url => App.api(url).catch(() => null);
            const [balance, dups, review, budgets, coverage, recurring] = await Promise.all([
                get('/api/audit/balance'), get('/api/audit/duplicates'), get('/api/audit/review-progress'),
                get('/api/budgets/status'), get('/api/insights/coverage'), get('/api/insights/recurring')
            ]);

            const rows = [];
            if (balance) {
                const broken = balance.filter(b => b.status === 'breaks');
                const total = broken.reduce((s, b) => s + b.unexplained_total, 0);
                if (broken.length) rows.push(attentionRow('bad',
                    `${money(total)} not explained by transactions`,
                    `Balance breaks in ${broken.map(b => esc(b.bank)).join(', ')} — likely a missing statement`, '/audit'));
            }
            if (dups && dups.length) {
                const over = dups.reduce((s, g) => s + g.overstatement, 0);
                rows.push(attentionRow('warn', `${dups.length} possible duplicate${dups.length === 1 ? '' : 's'}`,
                    `Up to ${money(over)} may be counted twice`, '/audit'));
            }
            if (budgets && budgets.budgets.length) {
                const over = budgets.budgets.filter(b => b.status === 'over');
                const risk = budgets.budgets.filter(b => b.status === 'at_risk');
                if (over.length) rows.push(attentionRow('bad', `Over budget: ${over.map(b => esc(b.target)).join(', ')}`,
                    `${monthLabel(budgets.month)} · ${over.map(b => `${esc(b.target)} ${money(b.actual)} of ${money(b.available)}`).join(' · ')}`, '/budgets'));
                if (risk.length) rows.push(attentionRow('warn', `On pace to overspend: ${risk.map(b => esc(b.target)).join(', ')}`,
                    `${monthLabel(budgets.month)}, projected from your usual spending`, '/budgets'));
            }
            if (coverage && coverage.pct_spend >= 10) {
                rows.push(attentionRow('warn', `${coverage.pct_spend}% of spending is uncategorized`,
                    `${money(coverage.uncategorized_total)} — budgets and category totals can't see it`, '/insights#coverage'));
            }
            if (recurring) {
                const changed = recurring.items.filter(i => i.status === 'active' && i.price_changes.length);
                changed.slice(0, 2).forEach(i => {
                    const c = i.price_changes[i.price_changes.length - 1];
                    rows.push(attentionRow('info', `${esc(i.payee)} changed price`,
                        `${money(c.from)} → ${money(c.to)} from ${fmtDate(c.date)}`, '/insights'));
                });
            }
            const clean = rows.length === 0;
            if (review && review.rows_total) {
                rows.push(attentionRow(review.pct_spend >= 90 ? 'ok' : 'info',
                    `${review.pct_spend}% of money reviewed`,
                    `${review.rows_reviewed.toLocaleString('en-IN')} of ${review.rows_total.toLocaleString('en-IN')} transactions checked`,
                    '/data?review=unreviewed&view=grid'));
            }
            if (clean) rows.unshift(attentionRow('ok', 'All clear', 'Balances reconcile, nothing double-counted, budgets on track', '/audit'));

            document.getElementById('attention').innerHTML = rows.join('');
        }
    </script>
</body>

</html>
